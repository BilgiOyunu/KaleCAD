/* Eski dijital atölye kartını görünür yap.

});

/* Eski soru sayıları ve alt bilgi yazılarını Temizle. */
document.querySelectorAll('footer,small,p,span,div,strong,b').forEach(function(el){
const txt=(el.textContent||'').replace(/\\s+/g,' ').trim().toLocaleLowerCase('tr-TR');
if(!txt||txt.length>140)return;

const hasQuestionCount=/\\b\\d+\\s*soru\\b/i.test(txt);
const hasOldCredits=/sketchup\\s*[/|·-]?\\s*autocad|autocad\\s*[/|·-]?\\s*sketchup/i.test(txt);

eğer (soru sayısı varsa || eski kredi varsa) {
const parent=el.parentElement;
if(parent && parent.children===1 && parent.textContent.trim().length<150){
parent.remove();
}aksi takdirde{
el.remove();
}
}
});

/* Bilinen eski alt bilgi alanı */
document.getElementById('kalecad-credit')?.remove();
document.querySelectorAll('[class*="footer"],[id*="footer"]').forEach(function(el){
const txt=(el.textContent||'').toLocaleLowerCase('tr-TR');
if(/\\d+\\s*soru|sketchup|autocad/.test(txt))el.remove();
});
}
