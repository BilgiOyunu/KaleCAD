
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102844">
<meta name="description" content="KALECAD - Mimarlık, iç mimarlık ve inşaat teknolojileri eğitim platformu">
<title>KALECAD</title>
<style>
@media(max-width:760px){
html,body{width:100%;min-height:100%;margin:0;padding:0;overflow-x:hidden}
body{display:block;min-height:100vh;min-height:100dvh;padding:0}
.app{width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;border-radius:0;border:0;overflow:hidden}
.header{position:sticky;top:0;z-index:50;padding:10px 14px;gap:8px}
.brand{gap:8px;font-size:14px;letter-spacing:.08em}
.brand img{width:40px;height:40px}
.sub{font-size:9px}
.header .btn{padding:9px 10px;font-size:12px;min-height:40px}
.screen{padding:18px 13px;width:100%;min-width:0}
.hero{padding:8px 4px 12px}
.hero img{width:120px;max-height:110px}
h1{font-size:clamp(23px,6vw,32px);line-height:1.2}
.hero p,.summary{font-size:14px;line-height:1.5}
.settings{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
.setting-card{width:100%;min-width:0;padding:13px;border-radius:14px}
.setting-title{flex-wrap:wrap;font-size:14px}
.setting-caption{font-size:11px}
.option{min-height:46px;padding:11px;font-size:13px}
.inline-options{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.category-options{grid-template-columns:repeat(3,minmax(0,1fr))}
.category-options .option{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;text-align:center;padding:10px 4px;overflow-wrap:anywhere}
.category-options .option small{white-space:normal;font-size:10px}
.actions{display:grid;grid-template-columns:1fr;gap:9px;margin:16px 0}
.actions button,.primary,.btn{width:100%;min-width:0;min-height:48px;padding:12px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px;font-size:13px}
.timer{grid-column:1/-1;justify-content:center}
.question{min-height:0;margin:20px 0 15px;font-size:21px;line-height:1.4;overflow-wrap:anywhere}
.answers{display:grid;grid-template-columns:1fr;gap:9px}
.answer{width:100%;min-height:58px;padding:13px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.feedback{font-size:14px;line-height:1.5}
.result-card{width:100%;padding:16px;margin:10px auto}
.result h2{font-size:24px}
.result-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.result-stats strong{font-size:21px}
#conquestMap{width:100%;max-width:100%;overflow:hidden}
#territoryMap{display:block;width:100%;height:auto;max-height:none}
#campusPicker{width:100%;min-width:0}
#campusPicker .inline-options{grid-template-columns:repeat(2,minmax(0,1fr))}
#campusPicker .option{min-height:48px}
#kaModal{padding:0!important;overflow-x:hidden!important}
#kaModal .kaWindow{width:100%;max-width:100%;min-height:100dvh;margin:0;border-radius:0;padding:12px}
#kaModal .kaGrid{grid-template-columns:1fr}
#kaModal button{min-height:46px;max-width:100%}
#kaModal .kaCard{min-width:0;overflow-wrap:anywhere}
}
@media(max-width:380px){
.header{padding:8px 10px}
.brand{font-size:12px}
.brand img{width:34px;height:34px}
.screen{padding:14px 10px}
.category-options{grid-template-columns:1fr}
.category-options .option{flex-direction:row;justify-content:space-between;text-align:left;padding:11px}
.result-stats{grid-template-columns:1fr}
}
@media(hover:none){
button,.option,.answer{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover,.option:hover,.primary:hover{transform:none}
}
</style>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;padding:2rem">KALECAD yükleniyor...</p>

<script>
(async function(){
try{
const response=await fetch(
'https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html',
{cache:'no-store'}
);
if(!response.ok)throw new Error('Oyun yüklenemedi: '+response.status);

let gameHtml=await response.text();
const mobileCss=document.querySelector('style').textContent;

gameHtml=gameHtml.replace(
/<\/head>/i,
'<style id="kalecad-mobile">'+mobileCss+'</style></head>'
);

const additions=
'<script src="./campus-selection.js?v=28c5626"><\/script>'+
'<script src="./conquest-map.js?v=3"><\/script>'+
'<script src="./autocad-atolye.js?v=5"><\/script>'+
'<script src="./oyun-merkezi.js?v=16"><\/script>'+
'<script src="./mesleki-sozluk.js?v=3"><\/script>'+
'<script src="./kitaplik.js?v=1"><\/script>';

const menuCode = `
(function(){
'use strict';
if(window.KALECAD_HOME_DESIGN_V3)return;
window.KALECAD_HOME_DESIGN_V3=true;

const css=document.createElement('style');
css.textContent=
'#kale-cad-card{display:none!important}'+
'#ksBtn,#kaleKitapBtn{display:none!important}'+
'#ka-home-panel{width:100%;grid-column:1/-1;margin:18px 0 24px;font-family:Arial,sans-serif;color:#17334e}'+
'#ka-home-panel *{box-sizing:border-box}'+
'#ka-home-panel .ka-banner{padding:25px 22px;border-radius:20px 20px 0 0;background:linear-gradient(125deg,#102844,#1b587b);color:#fff}'+
'#ka-home-panel .ka-overline{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#a8cce3;margin-bottom:18px}'+
'#ka-home-panel h2{font-size:25px;line-height:1.2;margin:0 0 9px;color:#fff}'+
'#ka-home-panel .ka-intro{font-size:13px;line-height:1.6;color:#d3e3ef;margin:0;max-width:490px}'+
'#ka-home-panel .ka-main{padding:20px;background:#f1f5f8;border:1px solid #dce5ed;border-top:0;border-radius:0 0 20px 20px}'+
'#ka-home-panel .ka-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-size:12px;font-weight:900;letter-spacing:1px;color:#294761}'+
'#ka-home-panel .ka-heading span{font-size:10px;color:#8294a5;letter-spacing:.5px}'+
'#ka-home-panel .ka-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}'+
'#ka-home-panel .ka-item{min-width:0;min-height:116px;padding:15px;border:1px solid #dce5ed;border-radius:14px;background:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;cursor:pointer;box-shadow:0 3px 10px #17334e08}'+
'#ka-home-panel .ka-item:active{transform:scale(.98);border-color:#3987b5}'+
'#ka-home-panel .ka-num{font-size:10px;font-weight:900;letter-spacing:1.5px;color:#2482b2}'+
'#ka-home-panel .ka-name{display:block;font-size:14px;line-height:1.3;font-weight:800;color:#183650}'+
'#ka-home-panel .ka-desc{display:block;margin-top:5px;font-size:11px;line-height:1.4;color:#718397}'+
'@media(max-width:420px){#ka-home-panel .ka-banner{padding:21px 17px}#ka-home-panel .ka-main{padding:14px}#ka-home-panel .ka-item{padding:12px;min-height:108px}#ka-home-panel .ka-name{font-size:13px}#ka-home-panel h2{font-size:22px}}';
document.head.appendChild(css);

const modules=[
['01','AutoCAD Akademi','Teknik çizim ve komutlar','auto'],
['02','SketchUp Akademi','Üç boyutlu modelleme','sketch'],
['03','Mesleki Sözlük','Türkçe ve İngilizce terimler','dictionary'],
['04','Kitaplık','Mesleki kaynaklar','library'],
['05','Bilgi Yarışması','Bilgini test et','quiz'],
['06','Proje Görevleri','Uygulama ve tasarım','tasks'],
['07','Çizim Masası','Dijital çizim alanı','draw'],
['08','Dijital Araçlar','Çevrim içi tasarım araçları','digital']
];

function openModule(key,oldCard){
if(key==='dictionary'){
const b=document.getElementById('ksBtn');
if(b){b.click();return;}
}
if(key==='library'){
const b=document.getElementById('kaleKitapBtn');
if(b){b.click();return;}
}
oldCard.click();
setTimeout(function(){
const tab=document.querySelector('#kcv2 [data-tab="'+key+'"]');
if(tab)tab.click();
},150);
}

let observer=null;

function build(){
const oldCard=document.getElementById('kale-cad-card');
if(!oldCard||document.getElementById('ka-home-panel'))return;

const panel=document.createElement('section');
panel.id='ka-home-panel';

panel.innerHTML=
'<div class="ka-banner">'+
'<div class="ka-overline">KALECAD / LEARNING PLATFORM</div>'+
'<h2>Dijital Tasarım Atölyesi</h2>'+
'<p class="ka-intro">Mimarlık, iç mimarlık ve inşaat teknolojileri için çizim, modelleme ve mesleki öğrenme alanı.</p>'+
'</div>'+
'<div class="ka-main">'+
'<div class="ka-heading">ATÖLYE BÖLÜMLERİ <span>08 MODÜL</span></div>'+
'<div class="ka-grid" id="ka-home-grid"></div>'+
'</div>';

const grid=panel.querySelector('#ka-home-grid');

modules.forEach(function(item){
const button=document.createElement('button');
button.type='button';
button.className='ka-item';
button.innerHTML=
'<span class="ka-num">'+item[0]+'</span>'+
'<span><strong class="ka-name">'+item[1]+'</strong>'+
'<small class="ka-desc">'+item[2]+'</small></span>';

button.addEventListener('click',function(){
openModule(item[3],oldCard);
});

grid.appendChild(button);
});

oldCard.insertAdjacentElement('afterend',panel);

const game=document.getElementById('kaleGamesBtn');
if(game)game.textContent='OYUN MERKEZİ';

if(observer)observer.disconnect();
}

function boot(){
build();
}

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',boot,{once:true});
}else{
boot();
}

observer=new MutationObserver(function(){
if(!document.getElementById('ka-home-panel'))build();
});

observer.observe(document.documentElement,{
childList:true,
subtree:true
});

})();
`;

const additionsFinal=
additions+
'<script>'+menuCode+'<\/script>';

if(!/<\/body>/i.test(gameHtml)){
throw new Error('Oyun HTML dosyasında body kapanışı bulunamadı.');
}

/* ÖNEMLİ: Menü kodu da dahil edilmiş tam script dizisi yükleniyor. */
gameHtml=gameHtml.replace(
/<\/body>/i,
additionsFinal+'</body>'
);

document.open();
document.write(gameHtml);
document.close();

}catch(error){
document.body.innerHTML=
'<main style="font-family:sans-serif;padding:2rem;text-align:center">'+
'<h1>KALECAD yüklenemedi</h1><p>'+error.message+'</p>'+
'<button onclick="location.reload()">Tekrar dene</button></main>';
}
})();
</script>
</body>
</html>
