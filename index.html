<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07163c" />
  <meta name="description" content="KALECAD — AutoCAD ve SketchUp bilgi yarışması" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>KALECAD | CAD Bilgi Yarışması</title>
  <style>
    :root{color-scheme:dark;--bg:#07163c;--line:rgba(190,204,235,.24);--text:#f7f8fc;--muted:#c5cde0;--green:#83d6b1;--red:#ff918c}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 75% 0%,#1a347c 0%,var(--bg) 54%,#040b20 100%);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:clamp(10px,2.3vw,24px);position:relative;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0}
    body:before{width:460px;height:460px;right:-120px;top:-80px;background:rgba(84,122,228,.8)}
    body:after{width:420px;height:420px;left:-140px;bottom:-60px;background:rgba(44,115,180,.7)}
    .app{position:relative;z-index:1;width:min(100%,1100px);min-height:min(92vh,900px);background:linear-gradient(145deg,rgba(14,31,78,.97),rgba(6,18,50,.98));border:1px solid var(--line);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.38);overflow:hidden;isolation:isolate}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,42,99,.9),rgba(12,29,75,.68));animation:headerIn .7s ease both}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo-mark{width:58px;height:58px;border-radius:14px;border:1px solid rgba(220,228,245,.5);overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.25);flex:none;animation:logoIn .8s cubic-bezier(.18,.8,.25,1) both}
    .logo-mark img{width:100%;height:100%;object-fit:cover;display:block;animation:logoFloat 4s ease-in-out infinite}
    h1{margin:0;font:700 clamp(1.3rem,3vw,2rem)/1 Georgia,"Times New Roman",serif;letter-spacing:.1em}.brand-subtitle{display:block;margin-top:5px;color:#d7dced;font:700 .58rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:.17em}
    .tag{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-size:.76rem;white-space:nowrap;font-weight:700}
    .screen{display:none;padding:clamp(18px,3vw,32px)}.screen.active{display:block}.hero{text-align:center;padding:12px 10px 6px}
    .hero-logo-wrap{display:grid;place-items:center;margin:0 auto;width:100%;padding:0;animation:heroIn .85s cubic-bezier(.18,.8,.25,1) both}.hero-logo{display:block;width:min(100%,720px);height:auto;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(1,8,28,.32));border-radius:24px;animation:logoFloat 4.5s ease-in-out infinite}
    .eyebrow{margin:16px 0 8px;color:#dce3f2;letter-spacing:.16em;font-weight:900;font-size:.72rem;animation:fadeUp .8s ease .15s both}.hero p{margin:14px auto 0;max-width:650px;font-size:1.02rem;line-height:1.6;color:var(--muted);animation:fadeUp .8s ease .2s both}
    .category-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px;animation:fadeUp .8s ease .25s both}.btn,.primary{appearance:none;border:1px solid rgba(220,228,245,.2);background:rgba(255,255,255,.045);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;transition:140ms ease;touch-action:manipulation}.btn:hover,.primary:hover{transform:translateY(-1px)}
    .btn.selected{background:linear-gradient(180deg,rgba(80,111,183,.55),rgba(48,73,139,.35));border-color:rgba(205,216,240,.55);box-shadow:0 0 0 1px rgba(190,204,235,.16)}.primary{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:14px 22px;border:1px solid rgba(232,237,248,.42);border-radius:14px;background:linear-gradient(135deg,#4665ad,#233e82);color:#fff;font-weight:900;letter-spacing:.04em;box-shadow:0 12px 26px rgba(5,14,43,.35)}
    .center-button{display:flex;justify-content:center;margin-top:22px}.pool-note{text-align:center;margin:18px 0 0;color:var(--muted);font-size:.82rem}.stats{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:.94rem;font-weight:700}.track{width:100%;height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px}.bar{width:0%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#aebbd8,#4969b1);transition:width 200ms ease}
    .question{margin:0 0 18px;font-size:clamp(1.4rem,3vw,2.15rem);line-height:1.38}.answers{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.answer{display:block;width:100%;min-height:68px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;line-height:1.4;transition:120ms ease}.answer:hover:not(:disabled){border-color:rgba(213,223,243,.7);background:rgba(166,184,222,.12)}.answer.correct{background:rgba(89,190,145,.2);border-color:rgba(131,214,177,.8)}.answer.wrong{background:rgba(255,125,115,.18);border-color:rgba(255,145,140,.7)}.answer:disabled{cursor:default;opacity:1}
    .feedback{min-height:28px;margin:18px 0 0;font-weight:800;line-height:1.5;font-size:1.02rem}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.level{margin:16px 0 18px;padding:18px;border-radius:16px;border:1px solid rgba(190,204,235,.38);background:rgba(28,51,112,.48);line-height:1.6;font-size:1rem}.level strong{color:#e4e9f4;font-size:1.35rem}.result{margin:16px 0 20px;padding:20px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:1.04rem;line-height:1.7}.scoreboard{margin-top:10px;width:100%;border-collapse:collapse;overflow:hidden;border-radius:12px}.scoreboard th,.scoreboard td{border:1px solid var(--line);padding:10px 12px;text-align:left}.scoreboard th{background:rgba(255,255,255,.07)}.scoreboard td:nth-child(2){text-align:right;font-weight:800}
    .celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.particle{position:absolute;left:50%;top:50%;width:clamp(34px,6vw,66px);height:clamp(34px,6vw,66px);object-fit:cover;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.35);animation:logo-burst 1.65s cubic-bezier(.12,.72,.24,1) forwards}.particle.spark{width:9px;height:15px;border-radius:4px;box-shadow:none;animation:confetti-burst 1.45s ease-out forwards}
    @keyframes heroIn{0%{opacity:0;transform:translateY(16px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes logoIn{0%{opacity:0;transform:translateY(-12px) scale(.92)}100%{opacity:1;transform:none}}
    @keyframes headerIn{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes logo-burst{0%{transform:translate(-50%,-50%) scale(.12) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.82) rotate(var(--r));opacity:0}}
    @keyframes confetti-burst{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
    @media(max-width:700px){.header{padding:12px 14px}.logo-mark{width:48px;height:48px}.answers{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch}.controls .btn,.controls .primary{width:100%}.tag{font-size:.65rem;padding:6px 8px}.hero-logo{width:min(100%,440px);border-radius:18px}.screen{padding:20px 16px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><div class="logo-mark"><img src="./logo.svg" alt="Kale Okulları logosu" /></div><div><h1>KALECAD</h1><span class="brand-subtitle">KALE OKULLARI</span></div></div>
      <span class="tag">AutoCAD • SketchUp</span>
    </header>
    <section id="home" class="screen active">
      <div class="hero">
        <div class="hero-logo-wrap"><img class="hero-logo" src="./logo.svg" alt="Kale Okulları logosu: kale simgesi ve KALE OKULLARI yazısı" /></div>
        <p class="eyebrow">KALE OKULLARI • ÇİZİM BİLGİSİ</p>
        <p>Hızlı ve eğlenceli CAD yarışmasına hazır mısın? Karışık moddan başlayıp hızla puan topla.</p>
      </div>
      <div class="category-row" aria-label="Kategori seçimi"><button class="btn selected" data-cat="all" type="button">Karışık</button><button class="btn" data-cat="AutoCAD" type="button">AutoCAD</button><button class="btn" data-cat="SketchUp" type="button">SketchUp</button></div>
      <p class="pool-note" id="poolNote"></p>
      <div class="center-button"><button class="primary" id="start" type="button">Başla</button></div>
    </section>
    <section id="quiz" class="screen">
      <div class="stats"><span id="qCount">Soru 1 / 10</span><span id="score">Puan: 0</span></div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <h2 class="question" id="question"></h2><div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="controls"><button class="primary hidden" id="next" type="button">Sonraki soru</button><button class="btn" data-home type="button">Ana menü</button></div>
    </section>
    <section id="result" class="screen">
      <h2>🏁 Tur tamamlandı!</h2><div class="level" id="levelText"></div><div class="result" id="resultText"></div>
      <table class="scoreboard" aria-label="Skor tablosu"><thead><tr><th>Gösterge</th><th>Sonuç</th></tr></thead><tbody><tr><td>Doğru</td><td id="correctCount">0</td></tr><tr><td>Yanlış</td><td id="wrongCount">0</td></tr><tr><td>Başarı</td><td id="accuracy">0%</td></tr><tr><td>Rekor</td><td id="bestStat">0</td></tr></tbody></table>
      <div class="center-button"><button class="primary" id="replay" type="button">Tekrar oyna</button></div><div class="center-button"><button class="btn" data-home type="button">Ana menü</button></div>
    </section>
  </main>
  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <script>
    const questions = [
      {category:'AutoCAD',q:'LINE komutu ne işe yarar?',a:'İki veya daha fazla nokta arasında düz çizgi çizer.',o:['İki veya daha fazla nokta arasında düz çizgi çizer.','Kapalı alanı tarar.','Nesneleri döndürür.','Ölçü ekler.']},
      {category:'AutoCAD',q:'PLINE komutu hangi nesneyi oluşturur?',a:'Birbirine bağlı çizgi ve yay parçalarından tek bir çoklu çizgi oluşturur.',o:['Birbirine bağlı çizgi ve yay parçalarından tek bir çoklu çizgi oluşturur.','Daire çizer.','Katman siler.','Görünümü yakınlaştırır.']},
      {category:'AutoCAD',q:'CIRCLE komutu ne için kullanılır?',a:'Merkezi ve yarıçapı/çapı belirlenen daire çizer.',o:['Merkezi ve yarıçapı/çapı belirlenen daire çizer.','Yay çizer.','Dikdörtgen çizer.','Nesneyi aynalar.']},
      {category:'AutoCAD',q:'MOVE komutu ne yapar?',a:'Seçili nesneleri belirlenen konuma taşır.',o:['Seçili nesneleri belirlenen konuma taşır.','Nesneleri kopyalar.','Nesneleri siler.','Nesneleri büyütür.']},
      {category:'AutoCAD',q:'OFFSET komutu hangi amaçla kullanılır?',a:'Bir nesneye belirli mesafede paralel kopya oluşturur.',o:['Bir nesneye belirli mesafede paralel kopya oluşturur.','Nesneleri döndürür.','Çizimi kaydeder.','Alanı hesaplar.']},
      {category:'AutoCAD',q:'TRIM komutu ne işe yarar?',a:'Nesneleri kesme sınırlarında kırpar.',o:['Nesneleri kesme sınırlarında kırpar.','Nesneleri uzatır.','Katmanları birleştirir.','Yazı ekler.']},
      {category:'AutoCAD',q:'MIRROR komutu hangi işlemi yapar?',a:'Nesnelerin belirlenen eksene göre simetriğini oluşturur.',o:['Nesnelerin belirlenen eksene göre simetriğini oluşturur.','Nesneleri taşır.','Yay oluşturur.','Çizgi kalınlığını ayarlar.']},
      {category:'AutoCAD',q:'HATCH komutunun görevi nedir?',a:'Kapalı alanı tarama veya dolgu ile doldurur.',o:['Kapalı alanı tarama veya dolgu ile doldurur.','Nesneyi patlatır.','Ölçü alır.','Görünümü kaydırır.']},
      {category:'AutoCAD',q:'OSNAP ne sağlar?',a:'Nokta, merkez ve kesişim gibi hassas noktalara yakalar.',o:['Nokta, merkez ve kesişim gibi hassas noktalara yakalar.','Çizimi dışa aktarır.','Nesneleri renklendirir.','Katman oluşturur.']},
      {category:'AutoCAD',q:'LAYER komutu neyi yönetir?',a:'Çizim katmanlarını yönetir.',o:['Çizim katmanlarını yönetir.','Daireleri düzenler.','Ölçekli çıktı alır.','Yazı tipini değiştirir.']},
      {category:'SketchUp',q:'Push/Pull aracı ne yapar?',a:'Yüzeyi itip çekerek 3B hacim veya girinti oluşturur.',o:['Yüzeyi itip çekerek 3B hacim veya girinti oluşturur.','Kamerayı döndürür.','Nesne rengini seçer.','Ölçü çizgisi ekler.']},
      {category:'SketchUp',q:'Orbit aracı ne için kullanılır?',a:'Kamerayı model etrafında döndürür.',o:['Kamerayı model etrafında döndürür.','Geometriyi siler.','Yüzeye doku uygular.','Modeli gruplar.']},
      {category:'SketchUp',q:'Tape Measure aracı ne yapar?',a:'Mesafeleri ölçer ve kılavuz oluşturur.',o:['Mesafeleri ölçer ve kılavuz oluşturur.','Yüzeyi yükseltir.','Gölge ekler.','Modeli dışa aktarır.']},
      {category:'SketchUp',q:'Make Group neden kullanılır?',a:'Geometriyi gruplayıp diğerlerinden ayırır.',o:['Geometriyi gruplayıp diğerlerinden ayırır.','Modeli aynalar.','Kamerayı yakınlaştırır.','Doku oluşturur.']},
      {category:'SketchUp',q:'Zoom Extents komutu ne sağlar?',a:'Tüm modeli ekrana sığdırır.',o:['Tüm modeli ekrana sığdırır.','Modeli kilitler.','Yeni sahne oluşturur.','Kesit düzlemi ekler.']},
      {category:'SketchUp',q:'Paint Bucket aracı hangi iş için kullanılır?',a:'Yüzeylere renk, malzeme veya doku uygular.',o:['Yüzeylere renk, malzeme veya doku uygular.','Kenarları yumuşatır.','Nesneyi taşır.','Kamerayı konumlandırır.']},
      {category:'SketchUp',q:'Scenes özelliği neyi kaydeder?',a:'Kamera ve görünüm durumlarını kaydeder.',o:['Kamera ve görünüm durumlarını kaydeder.','Malzeme kütüphanesini siler.','Nesne alanını ölçer.','Katı hacimleri çıkarır.']},
      {category:'SketchUp',q:'Follow Me aracı hangi sonucu üretir?',a:'Profili yol boyunca süpürerek 3B biçim oluşturur.',o:['Profili yol boyunca süpürerek 3B biçim oluşturur.','Çizgileri paralel kopyalar.','Kamerayı model içine taşır.','Etiketleri sıralar.']},
      {category:'SketchUp',q:'Eraser aracı ne yapar?',a:'Kenarları siler veya yumuşatır.',o:['Kenarları siler veya yumuşatır.','Katı hacmi birleştirir.','Yüzeyi döndürür.','Sahne kaydeder.']},
      {category:'SketchUp',q:'Section Plane ne için kullanılır?',a:'Modeli incelemek için kesit düzlemi oluşturur.',o:['Modeli incelemek için kesit düzlemi oluşturur.','Görünümü yakınlaştırır.','Yüzeylere renk verir.','Geometriyi kopyalar.']}
    ];
    const shuffle = a => {const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
    let category='all',list=[],index=0,points=0,locked=false;
    const $=id=>document.getElementById(id),screens=[...document.querySelectorAll('.screen')];
    function showScreen(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}
    function updatePoolNote(){$('poolNote').textContent=`${questions.filter(x=>category==='all'||x.category===category).length} soru • ${category==='all'?'AutoCAD ve SketchUp':category}`;}
    function setCategory(cat){category=cat;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('selected',b.dataset.cat===cat));updatePoolNote();}
    function startQuiz(){list=shuffle(questions.filter(x=>category==='all'||x.category===category)).slice(0,10);index=0;points=0;showScreen('quiz');renderQuestion();}
    function renderQuestion(){locked=false;const item=list[index];$('qCount').textContent=`Soru ${index+1} / ${list.length}`;$('question').textContent=item.q;$('score').textContent=`Puan: ${points}`;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('bar').style.width=`${index/list.length*100}%`;const wrap=$('answers');wrap.innerHTML='';shuffle(item.o).forEach(option=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=option;b.addEventListener('click',()=>chooseAnswer(b,option,item));wrap.appendChild(b);});}
    function logoBurst(){const layer=$('celebration');layer.innerHTML='';const colors=['#dce4f4','#aebbd8','#7c89ac','#eef2fa','#4969b1'];for(let i=0;i<34;i++){const p=document.createElement(i%3===0?'img':'span');p.className=`particle${i%3===0?'':' spark'}`;p.style.setProperty('--x',`${(Math.random()-.5)*Math.min(innerWidth*.95,920)}px`);p.style.setProperty('--y',`${(Math.random()-.5)*Math.min(innerHeight*.85,650)}px`);p.style.setProperty('--r',`${(Math.random()-.5)*900}deg`);if(i%3===0){p.src='./logo.svg';p.alt='';}else{p.style.background=colors[i%colors.length];}layer.appendChild(p);}window.setTimeout(()=>{layer.innerHTML='';},1800);}
    function chooseAnswer(button,selected,item){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===item.a)b.classList.add('correct');if(b===button&&selected!==item.a)b.classList.add('wrong');});const f=$('feedback');if(selected===item.a){points++;f.textContent='✓ Doğru!';f.classList.add('good');logoBurst();}else{f.textContent=`Yanlış! Doğru cevap: ${item.a}`;f.classList.add('bad');}$('score').textContent=`Puan: ${points}`;$('next').classList.remove('hidden');}
    function finishRound(){const total=list.length,wrong=total-points,ratio=Math.round(points/total*100),key='kalecad_best_blue',best=Math.max(Number(localStorage.getItem(key)||0),points);localStorage.setItem(key,String(best));$('correctCount').textContent=points;$('wrongCount').textContent=wrong;$('accuracy').textContent=`${ratio}%`;$('bestStat').textContent=best;$('levelText').innerHTML=ratio>=80?'<strong>Uzman</strong><br>CAD bilgin çok güçlü. Böyle devam et!':ratio>=50?'<strong>Orta Seviye</strong><br>Biraz daha pratikle uzmanlığa ulaşabilirsin.':'<strong>Pratiğe devam!</strong><br>Yeni bir turla kendini geliştirebilirsin.';$('resultText').innerHTML=`Bu turda <strong>${points} / ${total}</strong> doğru cevap verdin. Başarı oranı: <strong>${ratio}%</strong>.`;showScreen('result');}
    document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.cat)));document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>showScreen('home')));$('start').addEventListener('click',startQuiz);$('replay').addEventListener('click',startQuiz);$('next').addEventListener('click',()=>{if(index+1<list.length){index++;renderQuestion();}else finishRound();});setCategory('all');updatePoolNote();showScreen('home');
  </script>
</body>
</html>
