function loadScript(file){
return new Promise(function(resolve,reject){
const s=document.createElement('script');
s.src='./'+file+'?v='+version;
s.onload=resolve;
s.onerror=function(){reject(new Error(file+' yüklenemedi'));};
document.body.appendChild(s);
});
}

function waitFor(selector,ms){
return new Promise(function(resolve,reject){
const start=Date.now();
const timer=setInterval(function(){
const el=document.querySelector(selector);
if(el){
clearInterval(timer);
resolve(el);
}else if(Date.now()-start>ms){
clearInterval(timer);
reject(new Error(selector+' bulunamadı'));
}
},100);
});
}

/* TÜRKÇE KARAKTER ONARIMI */
function repair(value){
if(!value)return '';
let s=String(value);
if(!/[ÃÄÅÂâ€]/.test(s))return s;
try{
const bytes=new Uint8Array(Array.from(s).map(c=>c.charCodeAt(0)));
const fixed=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
if(fixed)return fixed;
}catch(e){}
return s;
}

function textOnly(value){
const d=document.createElement('div');
d.innerHTML=repair(value||'');
return repair((d.textContent||'').replace(/\s+/g,' ').trim());
}

function dateText(value){
if(!value)return '';
const d=new Date(value);
return Number.isNaN(d.getTime())?'':d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
}

function renderNews(id,items,source){
const target=document.getElementById(id);
if(!target)return;
target.replaceChildren();

if(!items||!items.length){
const msg=document.createElement('div');
msg.className='news-empty';
msg.textContent='Haber akışı şu anda alınamadı.';
target.appendChild(msg);
const a=document.createElement('a');
a.className='news-item';
a.href=source;
a.target='_blank';
a.rel='noopener noreferrer';
a.textContent='Haber kaynağını ziyaret et';
target.appendChild(a);
return;
}

items.slice(0,3).forEach(function(item){
const a=document.createElement('a');
a.className='news-item';
a.href=item.link||source;
a.target='_blank';
a.rel='noopener noreferrer';

const date=document.createElement('span');
date.className='news-date';
date.textContent=dateText(item.pubDate);

const title=document.createElement('span');
title.className='news-title';
title.textContent=textOnly(item.title)||'Başlıksız haber';

const desc=document.createElement('span');
desc.className='news-description';
desc.textContent=textOnly(item.description||item.content||'').slice(0,180);

const read=document.createElement('span');
read.className='news-read';
read.textContent='Haberi oku';

a.append(date,title);
if(desc.textContent)a.appendChild(desc);
a.appendChild(read);
target.appendChild(a);
});
}

async function fetchFeed(feed,target,source){
try{
const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)throw new Error('Haber servisi yanıt vermedi');
const data=await r.json();
if(data.status!=='ok'||!Array.isArray(data.items))throw new Error('RSS okunamadı');
renderNews(target,data.items,source);
}catch(e){
console.warn('KALECAD haber:',e);
renderNews(target,[],source);
}
}

async function loadNews(){
const b=document.getElementById('ka-news-refresh');
if(b){b.disabled=true;b.textContent='HABERLER ALINIYOR...';}
await Promise.all([
fetchFeed('https://www.arkitera.com/feed/','ka-architecture-news','https://www.arkitera.com/'),
fetchFeed('https://www.insaatdunyasi.com.tr/feed/','ka-construction-news','https://www.insaatdunyasi.com.tr/')
]);
if(b){b.disabled=false;b.textContent='HABERLERİ YENİLE';}
}
