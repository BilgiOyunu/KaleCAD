
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102844">
<meta name="description" content="KALECAD - Mimarlık, iç mimarlık ve inşaat teknolojileri eğitim platformu">
<title>KALECAD | Eğitim Platformu</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#102844}
#loading{text-align:center;padding:25px}
#loading p{font-size:15px}
#loading small{color:#64748b}
</style>
</head>
<body>
<div id="loading">
<h2>KALECAD</h2>
<p>Platform hazırlanıyor...</p>
<small>Lütfen bekleyin.</small>
</div>

<script>
(async function(){
'use strict';

const SOURCE='https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/main/index.html';

try{
 const response=await fetch(SOURCE,{cache:'no-store'});
 if(!response.ok)throw new Error('KALECAD kaynak dosyası alınamadı: '+response.status);

 let html=await response.text();

 const oldAbout=String.raw`const header=document.querySelector('.header');
 const sound=document.getElementById('soundToggle');
 const button=document.createElement('button');
 button.type='button';
 button.id='kaAboutButton';
 button.className='btn';
 button.textContent='Hakkımızda';
 button.addEventListener('click',function(){
 overlay.classList.add('open');
 document.body.style.overflow='hidden';
 });
 if(header&&sound)header.insertBefore(button,sound);
 else if(header)header.appendChild(button);`;

 const newAbout=String.raw`const header=document.querySelector('.header');
 const sound=document.getElementById('soundToggle');
 const button=sound ? sound.cloneNode(false) : document.createElement('button');

 button.removeAttribute('id');
 button.removeAttribute('onclick');
 button.removeAttribute('aria-pressed');
 button.id='kaAboutButton';
 button.type='button';
 button.textContent='Hakkımızda';
 button.setAttribute('aria-label','Hakkımızda');

 if(sound){
   const cs=getComputedStyle(sound);
   const rect=sound.getBoundingClientRect();

   ['background','background-color','color','border','border-radius',
    'box-shadow','font-family','font-size','font-weight','padding',
    'height','min-height','line-height','display','align-items',
    'justify-content'].forEach(function(prop){
      const value=cs.getPropertyValue(prop);
      if(value)button.style.setProperty(prop,value,'important');
   });

   if(rect.width)button.style.setProperty('width',rect.width+'px','important');
   button.style.setProperty('white-space','nowrap','important');
   button.style.setProperty('box-sizing','border-box','important');
 }

 button.addEventListener('click',function(){
   overlay.classList.add('open');
   document.body.style.overflow='hidden';
 });

 if(header&&sound)header.insertBefore(button,sound);
 else if(header)header.appendChild(button);`;

 if(!html.includes(oldAbout)){
   throw new Error('Hakkımızda düğmesinin kaynak bölümü bulunamadı. Dosya yapısı değişmiş olabilir.');
 }

 html=html.replace(oldAbout,newAbout);

 const oldCleanup=String.raw`document.getElementById('kalecad-credit')?.remove();
 document.querySelectorAll('footer,small,p,div').forEach(function(el){
 if(el.children.length===0 && /399\\s*soru|SketchUp\\s*AutoCAD|AutoCAD\\s*SketchUp/i.test(el.textContent||''))el.remove();
 });`;

 const newCleanup=String.raw`document.getElementById('kalecad-credit')?.remove();

 function cleanQuestionCount(root){
   if(!root)return;

   const pattern=/399\s*soru/i;

   root.querySelectorAll('footer,small,p,div,span').forEach(function(el){
     if(!el.isConnected)return;
     if(!pattern.test((el.textContent||'').replace(/\s+/g,' ')))return;

     const childMatch=Array.from(el.children).some(function(child){
       return pattern.test((child.textContent||'').replace(/\s+/g,' '));
     });

     if(childMatch)return;

     const directText=Array.from(el.childNodes)
       .filter(function(node){return node.nodeType===3;})
       .map(function(node){return node.nodeValue||'';})
       .join(' ');

     if(pattern.test(directText)){
       Array.from(el.childNodes).forEach(function(node){
         if(node.nodeType===3){
           node.nodeValue=node.nodeValue.replace(/399\s*soru/ig,'');
         }
       });
     }else{
       el.remove();
     }
   });

   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const nodes=[];
   while(walker.nextNode())nodes.push(walker.currentNode);

   nodes.forEach(function(node){
     if(/399\s*soru/i.test(node.nodeValue||'')){
       node.nodeValue=node.nodeValue.replace(/399\s*soru/ig,'');
     }
   });
 }

 cleanQuestionCount(document.body);

 if(!window.KALECAD_COUNT_OBSERVER){
   window.KALECAD_COUNT_OBSERVER=new MutationObserver(function(){
     if(window.KALECAD_CLEANING)return;
     window.KALECAD_CLEANING=true;
     requestAnimationFrame(function(){
       cleanQuestionCount(document.body);
       window.KALECAD_CLEANING=false;
     });
   });

   window.KALECAD_COUNT_OBSERVER.observe(document.body,{
     childList:true,
     subtree:true,
     characterData:true
   });
 }`;

 if(!html.includes(oldCleanup)){
   throw new Error('Soru sayısı temizleme bölümü bulunamadı. Dosya yapısı değişmiş olabilir.');
 }

 html=html.replace(oldCleanup,newCleanup);

 html=html.replaceAll("const version='20261120d';","const version='20261120f';");

 document.open();
 document.write(html);
 document.close();

}catch(error){
 document.body.innerHTML='';
 const box=document.createElement('main');
 box.style.cssText='font-family:Arial;padding:25px;text-align:center;color:#102844';
 const title=document.createElement('h2');
 title.textContent='KALECAD yüklenemedi';
 const message=document.createElement('p');
 message.textContent=error.message;
 const retry=document.createElement('button');
 retry.textContent='Tekrar dene';
 retry.style.cssText='padding:12px 22px;background:#102844;color:white;border:0;border-radius:8px';
 retry.onclick=function(){location.reload();};
 box.append(title,message,retry);
 document.body.appendChild(box);
 console.error(error);
}
})();
</script>
</body>
</html>
