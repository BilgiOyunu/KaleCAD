<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07163c" />
  <title>KALECAD | CAD Bilgi Yarışması</title>
  <style>
    :root{color-scheme:dark;--bg:#07163c;--panel:#0f1d40;--line:rgba(255,255,255,.18);--text:#f8fbff;--muted:#c8d4ed;--cyan:#64d9ff;--green:#7fe0b3;--red:#ff8d8d;--yellow:#f7d36d;--shadow:#00000040}
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 75% 0%,#1a347c 0%,var(--bg) 55%,#040b20 100%);color:var(--text)}
    body{display:grid;place-items:center;padding:18px}
    main{width:min(100%,980px);background:linear-gradient(145deg,rgba(17,35,80,.96),rgba(7,17,46,.97));border:1px solid var(--line);border-radius:24px;box-shadow:0 32px 80px var(--shadow);padding:clamp(18px,3vw,36px)}
    h1,h2,p{margin:0}
    .title{text-align:center;letter-spacing:.16em;font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:8px}
    .subtitle{text-align:center;color:var(--muted);margin-bottom:20px}
    .screen{display:none}.screen.active{display:block}
    .category-row,.actions,.stats,.header-row,.leaderboard{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
    .header-row{justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
    .chip,.btn,.primary{appearance:none;border:1px solid var(--line);background:#ffffff12;color:var(--text);padding:12px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
    .chip.selected,.primary{background:linear-gradient(135deg,#4f74d7,#213b82);border-color:#b7cafc}
    .chip:hover,.btn:hover,.primary:hover{transform:translateY(-1px)}
    .primary{min-width:180px}
    .hidden{display:none!important}
    .summary{color:var(--muted);text-align:center;margin:18px 0 14px}
    .stats{justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:var(--muted);font-weight:700}
    .timer{display:inline-flex;align-items:center;gap:10px}
    .timer-badge{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--cyan) 100%,#ffffff14 0);border:2px solid rgba(255,255,255,.18);font-size:1.1rem;color:var(--text)}
    .question{margin-top:20px;font-size:clamp(1.2rem,2.8vw,2rem);line-height:1.35;min-height:110px}
    .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
    .answer{width:100%;padding:14px 16px;border-radius:16px;text-align:left;background:#ffffff0c;border:1px solid var(--line);color:var(--text);font:inherit;font-weight:600;line-height:1.4}
    .answer.correct{background:rgba(127,224,179,.12);border-color:rgba(127,224,179,.8)}
    .answer.wrong{background:rgba(255,141,141,.12);border-color:rgba(255,141,141,.8)}
    .answer:disabled{cursor:default;opacity:1}
    .feedback{min-height:32px;margin-top:16px;font-weight:800;text-align:center}
    .feedback.good{color:var(--green)}
    .feedback.bad{color:var(--red)}
    .leaderboard{justify-content:space-between;gap:14px;margin-top:18px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:#ffffff08}
    .leaderboard strong{color:var(--yellow)}
    .result-box{text-align:center;padding:18px 8px}
    .result-box h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:10px}
    .result-box p{color:var(--muted);font-size:1.05rem;line-height:1.5}
    @media (max-width:720px){.answers{grid-template-columns:1fr}.header-row,.stats,.leaderboard{flex-direction:column;align-items:flex-start}.timer-badge{width:52px;height:52px}}
  </style>
</head>
<body>
  <main>
    <header class="header-row">
      <div>
        <h1 class="title">KALECAD</h1>
      </div>
      <div>
        <button id="soundToggle" class="btn" type="button" aria-pressed="true">🔊 Ses</button>
      </div>
    </header>

    <section id="home" class="screen active">
      <p class="subtitle">AutoCAD ve SketchUp bilgi yarışması</p>
      <div class="category-row" aria-label="Kategori seçimi">
        <button class="chip selected" data-cat="all" type="button">Hepsi</button>
        <button class="chip" data-cat="AutoCAD" type="button">AutoCAD</button>
        <button class="chip" data-cat="SketchUp" type="button">SketchUp</button>
      </div>
      <p id="poolText" class="summary"></p>
      <div class="actions" style="margin-top:18px">
        <button id="startBtn" class="primary" type="button">Oyuna başla</button>
      </div>
    </section>

    <section id="quiz" class="screen">
      <div class="stats">
        <span id="countText">Soru 1 / 10</span>
        <span id="scoreText">Puan: 0</span>
        <span class="timer"><span>⏱</span><span id="timerBadge" class="timer-badge">15</span></span>
      </div>
      <h2 id="questionText" class="question"></h2>
      <div id="answersWrap" class="answers"></div>
      <p id="feedbackText" class="feedback" aria-live="polite"></p>
      <div class="actions" style="margin-top:20px">
        <button id="nextBtn" class="primary hidden" type="button">Sonraki soru</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-box">
        <h2>Tur tamamlandı!</h2>
        <p id="resultText"></p>
        <div class="leaderboard">
          <span>En iyi skor: <strong id="bestScore">0</strong></span>
          <span>Bu tur: <strong id="roundScore">0</strong></span>
        </div>
        <div class="actions" style="margin-top:18px">
          <button id="replayBtn" class="primary" type="button">Yeni tur</button>
          <button id="homeBtn" class="btn" type="button">Ana menü</button>
        </div>
      </div>
    </section>
  </main>

    const templates = [
      (n) => `${n} komutu ne işe yarar?`,
      (n) => `${n} aracı hangi amaçla kullanılır?`,
      (n) => `${n} kullanıldığında sistem ne yapar?`,
      (n) => `Bir çizim/modelde ${n} hangi işlevi görür?`,
      (n) => `${n} ifadesiyle en doğru açıklama hangisidir?`,
      (n) => `${n} nedir ve ne işe yarar?`,
      (n) => `${n} hangi işlem için tercih edilir?`,
      (n) => `Aşağıdakilerden hangisi ${n} için doğru tanımdır?`,
      (n) => `${n} işlevi aşağıdakilerden hangisine karşılık gelir?`,
      (n) => `${n} aracının ana görevi nedir?`
    ];

    const state = {
      category: 'all',
      round: [],
      index: 0,
      score: 0,
      timer: 15,
      locked: false,
      timerId: null,
      sound: true,
      bank: []
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildBank() {
      const bank = [];
      Object.entries(categoryFacts).forEach(([cat, items]) => {
        items.forEach(([name, answer], itemIndex) => {
          templates.forEach((tpl, tplIndex) => {
            bank.push({
              id: `${cat}-${itemIndex}-${tplIndex}`,
              category: cat,
              question: tpl(name),
              answer,
              name
            });
          });
        });
      });
      return bank;
    }

    function getPool() {
      return state.bank.filter(q => state.category === 'all' || q.category === state.category);
    }

    function updatePoolText() {
      const pool = getPool();
      const label = state.category === 'all' ? 'AutoCAD + SketchUp' : state.category;
      document.getElementById('poolText').textContent = `Toplam ${pool.length} soru • ${label} havuzu`;
    }

    function setCategory(cat) {
      state.category = cat;
      document.querySelectorAll('[data-cat]').forEach(btn => btn.classList.toggle('selected', btn.dataset.cat === cat));
      updatePoolText();
    }

    function getWrongChoices(correctAnswer, cat) {
      const allAnswers = state.bank
        .filter(q => q.category === cat && q.answer !== correctAnswer)
        .map(q => q.answer);
      const unique = [...new Set(allAnswers)];
      return shuffle(unique).slice(0, 3);
    }

    function pickRound() {
      const pool = getPool();
      const selected = shuffle(pool).slice(0, 10);
      return selected;
    }

    function startRound() {
      clearInterval(state.timerId);
      state.round = pickRound();
      state.index = 0;
      state.score = 0;
      document.getElementById('home').classList.remove('active');
      document.getElementById('result').classList.remove('active');
      document.getElementById('quiz').classList.add('active');
      renderQuestion();
    }

    function renderQuestion() {
      state.locked = false;
      const q = state.round[state.index];
      if (!q) return finishRound();
      state.timer = 15;
      clearInterval(state.timerId);
      document.getElementById('countText').textContent = `Soru ${state.index + 1} / ${state.round.length}`;
      document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('feedbackText').textContent = '';
      document.getElementById('feedbackText').className = 'feedback';
      document.getElementById('nextBtn').classList.add('hidden');

      const answersWrap = document.getElementById('answersWrap');
      answersWrap.innerHTML = '';

      const options = shuffle([q.answer, ...getWrongChoices(q.answer, q.category)]).slice(0, 4);
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleAnswer(btn, opt === q.answer));
        answersWrap.appendChild(btn);
      });

      updateTimer();
      state.timerId = setInterval(() => {
        if (state.locked) return;
        state.timer = Math.max(0, state.timer - 1);
        updateTimer();
        if (state.timer <= 0) {
          clearInterval(state.timerId);
          revealAnswer(false, true);
        }
      }, 1000);
    }

    function updateTimer() {
      const badge = document.getElementById('timerBadge');
      badge.textContent = String(state.timer);
      const percent = (state.timer / 15) * 100;
      badge.style.background = `conic-gradient(var(--cyan) ${percent}%, #ffffff14 0)`;
    }

    function revealAnswer(correct, timedOut = false) {
      if (state.locked) return;
      state.locked = true;
      clearInterval(state.timerId);
      const q = state.round[state.index];
      const buttons = [...document.querySelectorAll('.answer')];
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) {
          btn.classList.add('correct');
        }
      });

      if (!correct) {
        const wrongButton = buttons.find(btn => btn.textContent !== q.answer && btn.textContent === document.querySelectorAll('.answer')[0].textContent && false);
        // no-op: wrong styling handled on click if relevant
      }

      if (correct) {
        state.score += 1;
        document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
        document.getElementById('feedbackText').textContent = 'Doğru cevap!';
        document.getElementById('feedbackText').classList.add('good');
      } else {
        const text = timedOut ? `Süre bitti! Doğru cevap: ${q.answer}` : `Yanlış cevap! Doğru cevap: ${q.answer}`;
        document.getElementById('feedbackText').textContent = text;
        document.getElementById('feedbackText').classList.add('bad');
      }

      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function handleAnswer(btn, isCorrect) {
      if (state.locked) return;
      state.locked = true;
      clearInterval(state.timerId);
      const q = state.round[state.index];
      const buttons = [...document.querySelectorAll('.answer')];
      buttons.forEach(b => {
        b.disabled = true;
        if (b.textContent === q.answer) b.classList.add('correct');
      });
      if (!isCorrect) btn.classList.add('wrong');
      if (isCorrect) {
        state.score += 1;
        document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
        document.getElementById('feedbackText').textContent = 'Doğru cevap!';
        document.getElementById('feedbackText').classList.add('good');
      } else {
        document.getElementById('feedbackText').textContent = `Yanlış cevap! Doğru cevap: ${q.answer}`;
        document.getElementById('feedbackText').classList.add('bad');
      }
      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function finishRound() {
      clearInterval(state.timerId);
      const bestKey = 'kalecad-best-score';
      let best = 0;
      try { best = Number(localStorage.getItem(bestKey) || 0); } catch (e) {}
      if (state.score > best) {
        try { localStorage.setItem(bestKey, String(state.score)); } catch (e) {}
        best = state.score;
      }

      document.getElementById('quiz').classList.remove('active');
      document.getElementById('result').classList.add('active');
      document.getElementById('bestScore').textContent = String(best);
      document.getElementById('roundScore').textContent = String(state.score);
      document.getElementById('resultText').textContent = `${state.round.length} sorudan ${state.score} doğru cevap. ${state.score >= 7 ? 'Harika! CAD bilgisi güçlü.' : state.score >= 4 ? 'Fena değil; bir sonraki turda daha da gelişecek.' : 'Biraz daha tekrar yap; her tur yeni sorular çıkacak.'}`;
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      state.index += 1;
      if (state.index < state.round.length) {
        renderQuestion();
      } else {
        finishRound();
      }
    });

    document.getElementById('startBtn').addEventListener('click', startRound);
    document.getElementById('replayBtn').addEventListener('click', startRound);
    document.getElementById('homeBtn').addEventListener('click', () => {
      document.getElementById('result').classList.remove('active');
      document.getElementById('home').classList.add('active');
    });

    document.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => setCategory(btn.dataset.cat));
    });

    document.getElementById('soundToggle').addEventListener('click', () => {
      state.sound = !state.sound;
      document.getElementById('soundToggle').textContent = state.sound ? '🔊 Ses' : '🔇 Sessiz';
    });

    state.bank = buildBank();
    setCategory('all');
    updatePoolText();
  </script>
</body>
</html>
