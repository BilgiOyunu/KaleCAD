
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102844">
<meta name="description" content="KALECAD - Mimarlık, iç mimarlık ve inşaat teknolojileri eğitim platformu">
<title>KALECAD | Eğitim Platformu</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#102844;color:#fff}
body{padding:0}
#ka-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.ka-loading{width:min(420px,100%);padding:28px;border:1px solid #31516d;border-radius:18px;background:#153653;text-align:center}
.ka-loading h1{margin:0 0 12px;font-size:28px;letter-spacing:1px}
.ka-loading p{color:#d1deea;line-height:1.5}
.ka-progress{height:7px;background:#294761;border-radius:20px;overflow:hidden;margin-top:20px}
.ka-progress span{display:block;width:35%;height:100%;background:#65bde8;border-radius:20px;animation:ka-progress 1.2s infinite ease-in-out alternate}
@keyframes ka-progress{from{transform:translateX(-20%)}to{transform:translateX(210%)}}
#ka-error{display:none;color:#ffd3d3;line-height:1.5;margin-top:16px}
#ka-controls{position:fixed;z-index:99999;top:10px;right:12px;display:flex;gap:8px;align-items:center}
#ka-controls button{font:inherit;font-weight:750;color:#fff;border:1px solid #46637c;border-radius:12px;padding:11px 15px;background:#ffffff0b;cursor:pointer;min-height:42px}
#ka-controls button:active{transform:scale(.98)}
@media(max-width:760px){
 #ka-controls{top:8px;right:8px;gap:6px}
 #ka-controls button{padding:9px 11px;font-size:12px;min-height:38px}
}
</style>
</head>

<body>
<div id="ka-loader">
 <div class="ka-loading">
  <h1>KALECAD</h1>
  <p>Eğitim platformu yükleniyor...</p>
  <div class="ka-progress"><span></span></div>
  <div id="ka-error"></div>
 </div>
</div>

<div id="ka-controls">
 <button id="ka-sound" type="button">Ses</button>
 <button id="ka-about" type="button">Hakkımızda</button>
</div>

<script>
(function(){
'use strict';

const BASE='https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html';

const loader=document.getElementById('ka-loader');
const error=document.getElementById('ka-error');

function showError(message){
 error.style.display='block';
 error.textContent=message;
}

function removeQuestionCounts(){
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const matches=[];
 let node;

 while((node=walker.nextNode())){
  if(/\b\d+\s+(?:yeni\s+)?soru\b/i.test(node.nodeValue||'')){
   const parent=node.parentElement;
   if(!parent)continue;
   if(parent.closest('#ka-loader,#ka-controls,#ka-about-panel'))continue;
   matches.push({node,parent});
  }
 }

 matches.forEach(function(item){
  const parent=item.parent;
  if(!parent.isConnected)return;
  if(parent.children.length===0 && parent.textContent.trim().length<160){
   parent.remove();
  }else{
   item.node.nodeValue=item.node.nodeValue.replace(
    /\b\d+\s+(?:yeni\s+)?soru(?:\s+mevcut)?/gi,''
   );
  }
 });
}

function installCleaner(){
 removeQuestionCounts();
 if(window.kaQuestionObserver)return;

 window.kaQuestionObserver=new MutationObserver(function(){
  removeQuestionCounts();
 });

 window.kaQuestionObserver.observe(document.body,{
  childList:true,
  subtree:true,
  characterData:true
 });
}

function installAbout(){
 if(document.getElementById('ka-about-panel'))return;

 const panel=document.createElement('div');
 panel.id='ka-about-panel';
 panel.style.cssText=[
  'display:none',
  'position:fixed',
  'inset:0',
  'z-index:100000',
  'background:rgba(0,0,0,.72)',
  'align-items:center',
  'justify-content:center',
  'padding:18px'
 ].join(';');

 panel.innerHTML=`
  <section style="width:min(620px,100%);max-height:85vh;overflow:auto;background:#153653;color:#fff;border:1px solid #46637c;border-radius:18px;padding:24px;line-height:1.65">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <h2 style="margin:0;color:#fff">KALECAD Hakkında</h2>
    <button id="ka-about-close" type="button" style="border:1px solid #46637c;background:#ffffff0b;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700">Kapat</button>
   </div>
   <p>KALECAD; mimarlık, iç mimarlık ve inşaat teknolojileri alanlarında mesleki öğrenmeyi desteklemek amacıyla hazırlanmış dijital bir eğitim platformudur.</p>
   <h3>Kale Okulları</h3>
   <p>Kale Okulları, öğrencilerin akademik gelişimlerinin yanında mesleki becerilerini, üretkenliklerini ve uygulama deneyimlerini geliştirmeyi hedefleyen eğitim yaklaşımıyla çalışmalarını sürdürür.</p>
   <h3>Platformun amacı</h3>
   <p>Öğrencilerin AutoCAD, SketchUp, yapı bilgisi, mimarlık ve iç mimarlık alanlarında öğrendiklerini pekiştirmelerine yardımcı olmak; dijital etkinlikler, uygulamalar ve oyunlaştırılmış öğrenme deneyimleri sunmaktır.</p>
   <p>KALECAD geliştirme sürecinde GitHub, GitHub Copilot ve ChatGPT gibi dijital araçlardan yararlanılmıştır.</p>
  </section>
 `;

 document.body.appendChild(panel);

 document.getElementById('ka-about').addEventListener('click',function(){
  panel.style.display='flex';
 });

 document.getElementById('ka-about-close').addEventListener('click',function(){
  panel.style.display='none';
 });

 panel.addEventListener('click',function(event){
  if(event.target===panel)panel.style.display='none';
 });
}

async function start(){
 try{
  const response=await fetch(BASE,{cache:'no-store'});
  if(!response.ok)throw new Error('Ana platform dosyası alınamadı. HTTP '+response.status);

  const html=await response.text();
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');

  document.title=doc.title||'KALECAD | Eğitim Platformu';

  const base=document.createElement('base');
  base.href='https://bilgioyunu.github.io/KaleCAD/';
  document.head.prepend(base);

  doc.querySelectorAll('link[rel="stylesheet"]').forEach(function(oldLink){
   const link=document.createElement('link');
   link.rel='stylesheet';
   link.href=oldLink.href;
   document.head.appendChild(link);
  });

  doc.querySelectorAll('style').forEach(function(oldStyle){
   const style=document.createElement('style');
   style.textContent=oldStyle.textContent;
   document.head.appendChild(style);
  });

  const root=document.createElement('div');
  root.id='ka-platform-root';
  root.innerHTML=doc.body.innerHTML;
  document.body.insertBefore(root,loader);
  loader.remove();

  doc.querySelectorAll('script').forEach(function(oldScript){
   const script=document.createElement('script');
   if(oldScript.src){
    script.src=oldScript.src;
   }else{
    script.textContent=oldScript.textContent;
   }
   if(oldScript.type)script.type=oldScript.type;
   document.body.appendChild(script);
  });

  installAbout();
  installCleaner();

  const sound=document.getElementById('soundToggle');
  const about=document.getElementById('ka-about');

  if(sound){
   const style=getComputedStyle(sound);
   about.style.cssText=[
    'font:'+style.font,
    'color:'+style.color,
    'font-weight:'+style.fontWeight,
    'border:'+style.border,
    'border-radius:'+style.borderRadius,
    'padding:'+style.padding,
    'background:'+style.background,
    'min-height:'+style.minHeight,
    'cursor:pointer'
   ].join(';');
  }

  const observer=new MutationObserver(function(){
   installCleaner();
   const soundButton=document.getElementById('soundToggle');
   if(soundButton){
    const style=getComputedStyle(soundButton);
    about.style.font=style.font;
    about.style.color=style.color;
    about.style.fontWeight=style.fontWeight;
    about.style.border=style.border;
    about.style.borderRadius=style.borderRadius;
    about.style.padding=style.padding;
    about.style.background=style.background;
    about.style.minHeight=style.minHeight;
   }
  });

  observer.observe(document.body,{childList:true,subtree:true});

 }catch(err){
  showError('Platform yüklenemedi: '+err.message+' Sayfayı yenileyin veya internet bağlantınızı kontrol edin.');
 }
}

document.getElementById('ka-sound').addEventListener('click',function(){
 const original=document.getElementById('soundToggle');
 if(original)original.click();
});

start();
})();
</script>
</body>
</html>
