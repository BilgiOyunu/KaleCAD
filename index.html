
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102844">
<meta name="description" content="KALECAD - Mimarlık, iç mimarlık ve inşaat teknolojileri eğitim platformu">
<title>KALECAD | Eğitim Platformu</title>
<style>
@media(max-width:760px){
html,body{width:100%;min-height:100%;margin:0;padding:0;overflow-x:hidden}
body{display:block;min-height:100vh;min-height:100dvh;padding:0}
.app{width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;border-radius:0;border:0;overflow:hidden}
.header{position:sticky;top:0;z-index:50;padding:10px 14px;gap:8px}
.brand{gap:8px;font-size:14px;letter-spacing:.08em}
.brand img{width:40px;height:40px}
.sub{font-size:9px}
.header .btn{padding:9px 10px;font-size:12px;min-height:40px}
.screen{padding:18px 13px;width:100%;min-width:0}
.hero{padding:8px 4px 12px}
.hero img{width:120px;max-height:110px}
h1{font-size:clamp(23px,6vw,32px);line-height:1.2}
.hero p,.summary{font-size:14px;line-height:1.5}
.settings{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
.setting-card{width:100%;min-width:0;padding:13px;border-radius:14px}
.setting-title{flex-wrap:wrap;font-size:14px}
.setting-caption{font-size:11px}
.option{min-height:46px;padding:11px;font-size:13px}
.inline-options{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.category-options{grid-template-columns:repeat(3,minmax(0,1fr))}
.category-options .option{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;text-align:center;padding:10px 4px;overflow-wrap:anywhere}
.category-options .option small{white-space:normal;font-size:10px}
.actions{display:grid;grid-template-columns:1fr;gap:9px;margin:16px 0}
.actions button,.primary,.btn{width:100%;min-width:0;min-height:48px;padding:12px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px;font-size:13px}
.timer{grid-column:1/-1;justify-content:center}
.question{min-height:0;margin:20px 0 15px;font-size:21px;line-height:1.4;overflow-wrap:anywhere}
.answers{display:grid;grid-template-columns:1fr;gap:9px}
.answer{width:100%;min-height:58px;padding:13px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.feedback{font-size:14px;line-height:1.5}
.result-card{width:100%;padding:16px;margin:10px auto}
.result h2{font-size:24px}
.result-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.result-stats strong{font-size:21px}
#conquestMap{width:100%;max-width:100%;overflow:hidden}
#territoryMap{display:block;width:100%;height:auto;max-height:none}
#campusPicker{width:100%;min-width:0}
#campusPicker .inline-options{grid-template-columns:repeat(2,minmax(0,1fr))}
#campusPicker .option{min-height:48px}
#kaModal{padding:0!important;overflow-x:hidden!important}
#kaModal .kaWindow{width:100%;max-width:100%;min-height:100dvh;margin:0;border-radius:0;padding:12px}
#kaModal .kaGrid{grid-template-columns:1fr}
#kaModal button{min-height:46px;max-width:100%}
#kaModal .kaCard{min-width:0;overflow-wrap:anywhere}
#soundToggle{width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important;padding:0!important;flex:0 0 40px!important}
#soundToggle svg{width:19px;height:19px}
}
@media(max-width:380px){
.header{padding:8px 10px}
.brand{font-size:12px}
.brand img{width:34px;height:34px}
.screen{padding:14px 10px}
.category-options{grid-template-columns:1fr}
.category-options .option{flex-direction:row;justify-content:space-between;text-align:left;padding:11px}
.result-stats{grid-template-columns:1fr}
#soundToggle{width:34px!important;height:34px!important;min-width:34px!important;min-height:34px!important;flex-basis:34px!important}
#soundToggle svg{width:17px;height:17px}
}
@media(hover:none){
button,.option,.answer{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover,.option:hover,.primary:hover{transform:none}
}
</style>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;padding:2rem">KALECAD yükleniyor...</p>

<script>
(async function(){
try{
const response=await fetch(
'https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html',
{cache:'no-store'}
);
if(!response.ok)throw new Error('Oyun yüklenemedi: '+response.status);

let gameHtml=await response.text();

/* PLATFORM METİNLERİ */
gameHtml=gameHtml.replaceAll(
'CAD BİLGİ YARIŞMASI',
'MİMARLIK VE TASARIM EĞİTİM PLATFORMU'
);

gameHtml=gameHtml.replace(
'<h1>CAD bilgini test et!</h1>',
'<h1>Tasarım ve Yapı Teknolojilerini Keşfet</h1>'
);

gameHtml=gameHtml.replace(
'<p>AutoCAD ve SketchUp sorularıyla her tur yeni bir meydan okuma.</p>',
'<p>Teknik çizim, üç boyutlu modelleme ve mesleki öğrenme tek platformda.</p>'
);

gameHtml=gameHtml.replace(
'>Oyuna geç</button>',
'>Platforma Gir</button>'
);

gameHtml=gameHtml.replace(
'>Oyuna başla</button>',
'>Platforma Başla</button>'
);

/* SES DÜĞMESİ */
const speakerOn='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

const speakerOff='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6"/><path d="m22 9-5 6"/></svg>';

gameHtml=gameHtml.replace(
/<button id="soundToggle"[^>]*>[\s\S]*?<\/button>/i,
'<button id="soundToggle" class="btn" type="button" aria-label="Sesi kapat" aria-pressed="true">'+speakerOn+'</button>'
);

gameHtml=gameHtml.replace(
"$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 Ses açık':'🔇 Ses kapalı';$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(soundOn)playTone(660,.12)};",
"$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').innerHTML=soundOn?"+JSON.stringify(speakerOn)+":"+JSON.stringify(speakerOff)+";$('soundToggle').setAttribute('aria-label',soundOn?'Sesi kapat':'Sesi aç');$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(soundOn)playTone(660,.12)};"
);

const soundCss=`
#soundToggle{
width:48px!important;
height:48px!important;
min-width:48px!important;
min-height:48px!important;
padding:0!important;
flex:0 0 48px!important;
display:grid!important;
place-items:center!important;
font-size:0!important;
border-radius:12px!important
}
#soundToggle svg{display:block;width:22px;height:22px}
`;

const mobileCss=document.querySelector('style').textContent+soundCss;

gameHtml=gameHtml.replace(
/<\/head>/i,
'<style id="kalecad-mobile">'+mobileCss+'</style></head>'
);

/* EK DOSYALAR */
const additions=
'<script src="./campus-selection.js?v=28c5626"><\/script>'+
'<script src="./conquest-map.js?v=3"><\/script>'+
'<script src="./autocad-atolye.js?v=5"><\/script>'+
'<script src="./oyun-merkezi.js?v=17"><\/script>'+
'<script src="./mesleki-sozluk.js?v=3"><\/script>'+
'<script src="./kitaplik.js?v=1"><\/script>';

/* DİJİTAL TASARIM ATÖLYESİ */
const menuCode=`
(function(){
'use strict';
if(window.KALECAD_HOME_DESIGN_V6)return;
window.KALECAD_HOME_DESIGN_V6=true;

const css=document.createElement('style');
css.textContent=
'#kale-cad-card{display:none!important}'+
'#ksBtn,#kaleKitapBtn{display:none!important}'+
'#ka-home-panel{display:block;width:100%;max-width:100%;margin:20px 0;padding:22px 14px;border-radius:24px;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#174c7d 0%,transparent 60%),linear-gradient(160deg,#06152e,#0b2850 65%,#10365e);border:1px solid #245582;box-shadow:0 12px 30px #0005;font-family:Arial,sans-serif}'+
'#ka-home-panel *{box-sizing:border-box}'+
'#ka-home-panel .ka-banner{padding:4px 4px 18px;text-align:center;background:transparent;color:#fff}'+
'#ka-home-panel .ka-overline{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#65caff;margin-bottom:13px}'+
'#ka-home-panel h2{font-size:clamp(21px,5vw,30px);line-height:1.2;margin:4px 0 7px;color:#f4f8ff;font-weight:1000;letter-spacing:1px;text-shadow:0 3px 12px #56baff66}'+
'#ka-home-panel .ka-intro{font-size:13px;line-height:1.6;color:#a9d5ff;margin:0 auto 18px;max-width:490px}'+
'#ka-home-panel .ka-heading{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;margin:0 0 17px;border:1px solid #3c8ebd;border-radius:15px;background:linear-gradient(110deg,#123d61,#0b2745);color:#d8efff;font-size:13px;font-weight:800}'+
'#ka-home-panel .ka-heading span{color:#65d2ff;font-size:11px}'+
'#ka-home-panel .ka-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}'+
'#ka-home-panel .ka-item{min-width:0;min-height:116px;padding:14px 10px;border:1px solid #285b89;border-radius:19px;background:linear-gradient(160deg,#102f53,#071b35);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;box-shadow:0 6px 15px #0005;transition:border-color .18s,background .18s,box-shadow .18s}'+
'#ka-home-panel .ka-item:active{transform:scale(.98);border-color:#26c5ff;background:linear-gradient(160deg,#104675,#082342);box-shadow:0 0 18px #00aaff77,inset 0 0 18px #008cff22}'+
'#ka-home-panel .ka-num{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#55caff}'+
'#ka-home-panel .ka-name{display:block;font-size:14px;line-height:1.3;font-weight:1000;color:#f4f8ff}'+
'#ka-home-panel .ka-desc{display:block;margin-top:5px;font-size:11px;line-height:1.4;color:#a9c9e5}'+
'@media(max-width:420px){'+
'#ka-home-panel{padding:19px 11px;margin:20px 0;border-radius:20px}'+
'#ka-home-panel .ka-banner{padding:4px 3px 16px}'+
'#ka-home-panel .ka-heading{padding:11px 9px;font-size:12px}'+
'#ka-home-panel .ka-grid{gap:9px}'+
'#ka-home-panel .ka-item{padding:12px 8px;min-height:108px;border-radius:16px}'+
'#ka-home-panel .ka-name{font-size:13px}'+
'#ka-home-panel .ka-desc{font-size:10px}'+
'#ka-home-panel h2{font-size:22px}'+
'}';

document.head.appendChild(css);

const modules=[
['01','AutoCAD Akademi','Teknik çizim ve komutlar','auto'],
['02','SketchUp Akademi','Üç boyutlu modelleme','sketch'],
['03','Mesleki Sözlük','Türkçe ve İngilizce terimler','dictionary'],
['04','Kitaplık','Mesleki kaynaklar','library'],
['05','Bilgi Yarışması','Bilgini test et','quiz'],
['06','Proje Görevleri','Uygulama ve tasarım','tasks'],
['07','Çizim Masası','Dijital çizim alanı','draw'],
['08','Dijital Araçlar','Çevrim içi tasarım araçları','digital']
];

function openModule(key,oldCard){
if(key==='dictionary'){
const b=document.getElementById('ksBtn');
if(b){b.click();return;}
}
if(key==='library'){
const b=document.getElementById('kaleKitapBtn');
if(b){b.click();return;}
}
if(!oldCard)return;
oldCard.click();
setTimeout(function(){
const tab=document.querySelector('#kcv2 [data-tab="'+key+'"]');
if(tab)tab.click();
},180);
}

function build(){
const map=document.getElementById('kalecadHistoricMap');
const oldCard=document.getElementById('kale-cad-card');

if(!map||!oldCard||document.getElementById('ka-home-panel'))return;

const panel=document.createElement('section');
panel.id='ka-home-panel';

panel.innerHTML=
'<div class="ka-banner">'+
'<div class="ka-overline">KALECAD / DIGITAL WORKSHOP</div>'+
'<h2>DİJİTAL TASARIM ATÖLYESİ</h2>'+
'<p class="ka-intro">Mimarlık, iç mimarlık ve inşaat teknolojileri için çizim, modelleme ve mesleki öğrenme alanı.</p>'+
'</div>'+
'<div class="ka-heading">ATÖLYE BÖLÜMLERİ <span>08 MODÜL</span></div>'+
'<div class="ka-grid" id="ka-home-grid"></div>';

const grid=panel.querySelector('#ka-home-grid');

modules.forEach(function(item){
const button=document.createElement('button');
button.type='button';
button.className='ka-item';
button.innerHTML=
'<span class="ka-num">'+item[0]+'</span>'+
'<span><strong class="ka-name">'+item[1]+'</strong>'+
'<small class="ka-desc">'+item[2]+'</small></span>';

button.addEventListener('click',function(){
openModule(item[3],oldCard);
});

grid.appendChild(button);
});

map.insertAdjacentElement('afterend',panel);
}

function boot(){build();}

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',boot,{once:true});
}else{
boot();
}

const observer=new MutationObserver(function(){
if(!document.getElementById('ka-home-panel'))build();
});

observer.observe(document.documentElement,{
childList:true,
subtree:true
});

})();
`;

/* SON YERLEŞİM DÜZENİ */
const finalLayoutCode=`
(function(){
'use strict';

if(window.KALECAD_FINAL_LAYOUT_V1)return;
window.KALECAD_FINAL_LAYOUT_V1=true;

const style=document.createElement('style');
style.textContent=
'#kaleGamesBtn{position:relative!important;right:auto!important;bottom:auto!important;left:auto!important;top:auto!important;z-index:5!important;width:min(100%,360px)!important;height:52px!important;min-height:52px!important;margin:16px auto 20px!important;padding:0 18px!important;display:flex!important;align-items:center!important;justify-content:center!important;box-sizing:border-box!important;border:1px solid #f7b35b!important;border-radius:14px!important;background:linear-gradient(120deg,#f0a12e,#d97821)!important;color:#102844!important;font-size:15px!important;font-weight:900!important;letter-spacing:.3px!important;box-shadow:0 7px 20px #0004!important}'+
'#campusPicker .campus-title .setting-title{font-size:clamp(21px,5vw,28px)!important;font-weight:1000!important;letter-spacing:1px!important}'+
'#kalecad-credit{display:block;width:100%;padding:12px 8px 18px;text-align:center;color:#b8c8d8;font-family:Arial,sans-serif;font-size:9px;line-height:1.5;opacity:.32;letter-spacing:.2px;box-sizing:border-box}';

document.head.appendChild(style);

function arrange(){
const picker=document.querySelector('#campusPicker .campus-title .setting-title');
if(picker&&picker.textContent.trim()!=='SAVUNULACAK KALE'){
picker.textContent='SAVUNULACAK KALE';
}

const map=document.getElementById('kalecadHistoricMap');
const game=document.getElementById('kaleGamesBtn');
const panel=document.getElementById('ka-home-panel');

if(!map)return;

if(game){
game.textContent='CAD Oyununa Giriş Yap';
if(map.nextElementSibling!==game){
map.insertAdjacentElement('afterend',game);
}
}

if(panel&&game&&game.nextElementSibling!==panel){
game.insertAdjacentElement('afterend',panel);
}

let credit=document.getElementById('kalecad-credit');
if(!credit){
credit=document.createElement('footer');
credit.id='kalecad-credit';
credit.textContent='Bu uygulama Alperen Furkan Arpaç tarafından GitHub ve ChatGPT ile geliştirilmiştir.';
}

if(panel&&panel.nextElementSibling!==credit){
panel.insertAdjacentElement('afterend',credit);
}
}

const observer=new MutationObserver(arrange);
observer.observe(document.documentElement,{
childList:true,
subtree:true,
characterData:true
});

if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',arrange,{once:true});
}else{
arrange();
}

})();
`;

const additionsFinal=
additions+
'<script>'+menuCode+'<\/script>'+
'<script>'+finalLayoutCode+'<\/script>';

if(!/<\/body>/i.test(gameHtml)){
throw new Error('Oyun HTML dosyasında body kapanışı bulunamadı.');
}

gameHtml=gameHtml.replace(
/<\/body>/i,
additionsFinal+'</body>'
);

document.open();
document.write(gameHtml);
document.close();

}catch(error){
document.body.innerHTML=
'<main style="font-family:sans-serif;padding:2rem;text-align:center">'+
'<h1>KALECAD yüklenemedi</h1><p>'+error.message+'</p>'+
'<button onclick="location.reload()">Tekrar dene</button></main>';
}
})();
</script>
</body>
</html>
