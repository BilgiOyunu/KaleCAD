<head>

<style>
:root{color-scheme:dark;--bg:#07163c;--line:#ffffff2e;--text:#f7f8fc;--muted:#c5cde0;--cyan:#64d9ff;--green:#83d6b1;--red:#ff918c;--gold:#f5d66f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 75% 0%,#1a347c,var(--bg) 55%,#040b20);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:16px}.app{position:relative;width:min(100%,1000px);min-height:min(90vh,850px);overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#10234fef,#061232f5);box-shadow:0 28px 80px #0007;animation:appEnter .75s cubic-bezier(.2,.8,.2,1) both}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#10234f66}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.brand img{width:48px;height:48px;object-fit:cover;border-radius:12px}.sub{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.15em;margin-top:3px}.screen{display:none;padding:clamp(18px,3vw,32px)}.screen.active{display:block;animation:screenIn .4s ease both}.hero{text-align:center;padding:8px 10px 12px}.hero img{width:min(34vw,170px);max-height:140px;object-fit:contain;filter:drop-shadow(0 10px 22px #0006)}h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:8px 0}.hero p,.summary{text-align:center;color:var(--muted);line-height:1.55}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.setting-card{min-width:0;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#ffffff0b,#ffffff04)}.setting-title{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:850;margin:0 0 12px}.setting-caption{color:var(--muted);font-size:.78rem;font-weight:500;margin-left:auto}.option-list{display:grid;gap:8px}.category-options{grid-template-columns:1fr}.option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;text-align:left;font:inherit;color:var(--text);font-weight:750;border:1px solid #ffffff20;border-radius:11px;background:#ffffff08;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.option:hover{transform:translateY(-1px);background:#ffffff12}.option.selected{border-color:#9fcaff;background:linear-gradient(110deg,#3b5ea966,#263c7555);box-shadow:inset 3px 0 var(--cyan)}.option small{color:var(--muted);font-weight:600;white-space:nowrap}.inline-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.inline-options .option{justify-content:center;text-align:center;padding:10px 6px}.summary{min-height:24px;margin:12px auto}.row,.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}.btn,.primary{font:inherit;color:var(--text);font-weight:750;border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#ffffff0b;cursor:pointer}.primary{min-width:180px;background:linear-gradient(135deg,#4665ad,#233e82);border-color:#b7caff}.btn:hover,.primary:hover{filter:brightness(1.15);transform:translateY(-1px)}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:750;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#ffffff06}.timer{display:flex;align-items:center;gap:9px}.timer-ring{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--cyan) 100%,#ffffff18 0)}.timer-ring span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0b1c4d;color:var(--text)}.question{font-size:clamp(1.3rem,3vw,2rem);line-height:1.4;min-height:76px;margin:24px 0 14px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{font:inherit;font-weight:700;color:var(--text);text-align:left;line-height:1.4;min-height:68px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:#ffffff0b;cursor:pointer}.answer.correct{background:#2f805c55;border-color:var(--green)}.answer.wrong{background:#a33f4c55;border-color:var(--red)}.answer:disabled{cursor:default}.feedback{min-height:28px;text-align:center;font-weight:800;margin:16px 0 4px;line-height:1.4}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.feedback.small{font-size:.95rem;font-weight:700}.result{text-align:center}.result h2{font-size:2rem}.result-card{max-width:680px;margin:18px auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.result-stats{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;color:var(--muted)}.result-stats strong{display:block;color:var(--gold);font-size:1.6rem;margin-top:5px}.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}.confetti img{position:absolute;left:50%;top:48%;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 12px #64d9ffb0);animation:explode 1.45s cubic-bezier(.15,.65,.25,1) forwards}@keyframes appEnter{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes explode{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.8) rotate(var(--r))}}.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a347c 0%,#07163c 58%,#040b20 100%);transition:opacity .7s ease,visibility .7s ease}.splash.hidden{opacity:0;visibility:hidden;pointer-events:none}.splash-grid{position:absolute;inset:-40%;opacity:.25;background-image:linear-gradient(#64d9ff35 1px,transparent 1px),linear-gradient(90deg,#64d9ff35 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(58deg) scale(1.6);animation:gridMove 12s linear infinite}.splash-orbit{position:absolute;width:min(75vw,560px);aspect-ratio:1;border:1px dashed #91e7ff66;border-radius:50%;box-shadow:0 0 70px #64d9ff1a,inset 0 0 70px #64d9ff12;animation:orbit 24s linear infinite}.splash-inner{position:relative;display:grid;justify-items:center;gap:14px;padding:28px;text-align:center;animation:splashRise .9s cubic-bezier(.2,.8,.2,1) both}.splash-logo{width:clamp(120px,24vw,210px);filter:drop-shadow(0 12px 30px #64d9ff55);animation:logoPulse 2.4s ease-in-out infinite}.splash-name{margin:0;font-size:clamp(2rem,7vw,4.2rem);letter-spacing:.2em;text-shadow:0 0 30px #64d9ff66}.splash-caption{color:var(--muted);letter-spacing:.24em;font-size:.82rem}.splash-progress{width:min(290px,70vw);height:5px;border-radius:99px;background:#ffffff24;overflow:hidden}.splash-progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),#fff);box-shadow:0 0 12px var(--cyan);animation:loadBar 1.35s ease .1s forwards}.launch{margin-top:5px;opacity:0;animation:fadeIn .45s ease 1.15s forwards}@keyframes gridMove{to{background-position:0 84px,84px 0}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes splashRise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes logoPulse{50%{transform:translateY(-5px);filter:drop-shadow(0 18px 36px #64d9ff8a)}}@keyframes loadBar{to{width:100%}}@keyframes fadeIn{to{opacity:1}}@media(max-width:760px){.settings{grid-template-columns:1fr}.category-options{grid-template-columns:repeat(3,minmax(0,1fr))}.category-options .option{display:grid;justify-items:center;text-align:center;padding:11px 5px}.category-options .option small{white-space:normal}.answers{grid-template-columns:1fr}.stats{flex-wrap:wrap}.screen{padding:20px 16px}.question{min-height:0}}@media(max-width:420px){.category-options{grid-template-columns:1fr}.category-options .option{display:flex;text-align:left;padding:10px 12px}.category-options .option small{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-label="KALECAD açılış ekranı"><div class="splash-grid"></div><div class="splash-orbit"></div><div class="splash-inner"><img class="splash-logo" src="./logo.svg" alt="KALECAD logo"><h1 class="splash-name">KALECAD</h1><p class="splash-caption">CAD BİLGİ YARIŞMASI</p><div class="splash-progress" aria-hidden="true"><span></span></div><button class="primary launch" id="launchBtn" type="button">Oyuna geç</button></div></div>
<main class="app">
<header class="header"><div class="brand"><img src="./logo.svg" alt="KALECAD"><div>KALECAD<span class="sub">CAD BİLGİ YARIŞMASI</span></div></div><button id="soundToggle" class="btn" type="button" aria-pressed="true">🔊 Ses açık</button></header>
<section id="home" class="screen active"><div class="hero"><img src="./logo.svg" alt="KaleCAD logo"><h1>CAD bilgini test et!</h1><p>AutoCAD ve SketchUp sorularıyla her tur yeni bir meydan okuma.</p></div>
<div class="settings">
<div class="setting-card"><h2 class="setting-title">▦ <span>Kategori</span><span class="setting-caption">Soru konusu</span></h2><div class="option-list category-options"><button class="option selected" data-cat="all"><span>Hepsi</span><small>İki konu</small></button><button class="option" data-cat="AutoCAD"><span>AutoCAD</span><small>Teknik çizim</small></button><button class="option" data-cat="SketchUp"><span>SketchUp</span><small>3B modelleme</small></button></div></div>
<div class="setting-card"><h2 class="setting-title">◈ <span>Zorluk</span><span class="setting-caption">Seviyeni seç</span></h2><div class="inline-options"><button class="option selected" data-diff="all">Tümü</button><button class="option" data-diff="easy">Kolay</button><button class="option" data-diff="medium">Orta</button><button class="option" data-diff="hard">Zor</button></div></div>
<div class="setting-card"><h2 class="setting-title">⏱ <span>Soru süresi</span><span class="setting-caption">Her soru için</span></h2><div class="inline-options"><button class="option" data-time="10">10 sn</button><button class="option selected" data-time="15">15 sn</button><button class="option" data-time="20">20 sn</button></div></div>
</div><p id="poolNote" class="summary"></p><div class="actions"><button id="start" class="primary">Oyuna başla</button></div></section>
<section id="quiz" class="screen"><div class="stats"><span id="qCount">Soru 1 / 10</span><span id="score">Puan: 0</span><span class="timer">⏱ <span class="timer-ring" id="timerRing"><span id="timerValue">15</span></span></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><p id="explainText" class="feedback small" aria-live="polite"></p></section>
<section id="result" class="screen"><div class="result result-card"><h2>🏁 Tur tamamlandı!</h2><p id="resultText" class="summary"></p><div class="result-stats"><span>Bu tur<strong id="roundScore">0</strong></span><span>Doğru<strong id="correctCount">0</strong></span><span>Rekor<strong id="bestScore">0</strong></span></div><div class="actions"><button id="replay" class="primary">Yeni tur</button><button id="homeBtn" class="btn">Ana menü</button></div></div></section>
</main><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
const facts={AutoCAD:[['LINE','İki veya daha fazla nokta arasında düz çizgi çizer.'],['PLINE','Bağlı çizgi ve yay parçalarını tek bir çoklu çizgi nesnesi olarak oluşturur.'],['CIRCLE','Merkez ve yarıçap ya da çap bilgisiyle daire çizer.'],['ARC','Bir daire yayının belirlenen bölümünü oluşturur.'],['RECTANG','Dikdörtgeni tek bir kapalı çoklu çizgi olarak oluşturur.'],['POLYGON','Belirlenen kenar sayısına sahip düzgün çokgen çizer.'],['MOVE','Seçilen nesneleri bir konumdan başka bir konuma taşır.'],['COPY','Seçilen nesnelerin bir veya daha fazla kopyasını oluşturur.'],['ROTATE','Seçilen nesneleri bir taban noktası çevresinde döndürür.'],['SCALE','Seçilen nesnelerin boyutunu ölçek katsayısıyla değiştirir.'],['MIRROR','Nesnelerin belirlenen eksene göre simetrik kopyasını oluşturur.'],['OFFSET','Bir nesneye belirli mesafede paralel veya eş merkezli kopya oluşturur.'],['TRIM','Nesneleri seçilen kesme sınırlarına göre kırpar.'],['EXTEND','Nesneleri seçilen sınırlara kadar uzatır.'],['FILLET','İki nesne arasına belirlenen yarıçapta yuvarlatılmış geçiş ekler.'],['CHAMFER','İki nesnenin köşesini belirlenen mesafelerle pah kırarak birleştirir.'],['ARRAY','Nesnelerin düzenli, yinelenen kopyalarını oluşturur.'],['HATCH','Kapalı alanları tarama deseni veya dolgu ile doldurur.'],['LAYER','Çizim elemanlarını ayrı katmanlarda düzenleyip yönetir.'],['OSNAP','Nesnelerin uç, orta ve merkez gibi geometrik noktalarına hassas yakalama sağlar.']],SketchUp:[['Push/Pull','Bir yüzeyi itip çekerek 3B hacim veya girinti oluşturur.'],['Orbit','Kamerayı modelin çevresinde döndürerek farklı açılardan görünüm sağlar.'],['Pan','Kamerayı döndürmeden görünümü yatay veya dikey kaydırır.'],['Zoom Extents','Modeldeki tüm geometriyi görünür alana sığdırır.'],['Tape Measure','Mesafeleri ölçer ve kılavuz çizgileri oluşturabilir.'],['Move','Seçilen geometriyi taşır; uygun kısayolla kopyasını da oluşturabilir.'],['Rotate','Geometriyi seçilen bir merkez ve eksen çevresinde döndürür.'],['Scale','Seçilen geometriyi ölçek tutamaçlarıyla büyütür veya küçültür.'],['Follow Me','Bir yüz profilini seçilen yol boyunca süpürerek 3B biçim oluşturur.'],['Offset','Bir yüzün kenarlarından eşit uzaklıklı iç veya dış kontur oluşturur.'],['Paint Bucket','Yüzlere renk, malzeme veya doku uygular.'],['Eraser','Kenarları siler; kenar yumuşatma görünümünü de düzenleyebilir.'],['Rectangle','Dört kenarlı dikdörtgen yüz ve kenarlar oluşturur.'],['Line','Kenar çizer; kapalı çevrim tamamlandığında yüz oluşmasını sağlar.'],['Arc','Yay tabanlı kenar geometrisi oluşturur.'],['Make Group','Geometriyi diğer model geometrisinden yalıtan bir grup oluşturur.'],['Make Component','Geometriyi yeniden kullanılabilir bileşene dönüştürür.'],['Outliner','Modeldeki grup ve bileşenlerin hiyerarşisini listeler.'],['Tags','Gruplara ve bileşenlere görünürlük yönetimi için etiket atar.'],['Scenes','Kamera görünümü ve görünürlük gibi model durumlarını kaydeder.']]};
const templates=[n=>`${n} komutu/aracı ne işe yarar?`,n=>`${n} kullanıldığında hangi işlem yapılır?`,n=>`Hangi işlev ${n} ile gerçekleştirilir?`,n=>`${n} aracının temel amacı nedir?`,n=>`Bir çizimde/modelde ${n} ne sağlar?`,n=>`${n} seçeneği hangi sonucu oluşturur?`,n=>`${n} hangi tür düzenleme için kullanılır?`,n=>`${n} ile ilgili doğru açıklama hangisidir?`,n=>`Hangi araç/komut şu işlemi yapar: ${n}?`,n=>`${n} kullanıldığında ne elde edilir?`];
const easyNames=new Set(['LINE','CIRCLE','MOVE','COPY','Rectangle','Orbit','Pan','Paint Bucket','Push/Pull']),mediumNames=new Set(['PLINE','OFFSET','TRIM','EXTEND','Tape Measure','Rotate','Scale','Follow Me','Make Group','Tags']);const $=id=>document.getElementById(id);let bank=[],category='all',difficulty='all',round=[],index=0,score=0,correctCount=0,locked=false,seconds=15,chosenTime=15,timerId=null,advanceId=null,soundOn=true,audioCtx=null,usedIds=new Set();const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function buildBank(){const out=[];for(const [cat,items] of Object.entries(facts))items.forEach(([name,answer],i)=>templates.forEach((make,j)=>out.push({id:`${cat}-${i}-${j}`,category:cat,name,answer,q:make(name),difficulty:easyNames.has(name)?'easy':mediumNames.has(name)?'medium':'hard'})));return out}function filteredPool(){return bank.filter(q=>(category==='all'||q.category===category)&&(difficulty==='all'||q.difficulty===difficulty)&&!usedIds.has(q.id))}function updatePool(){const n=filteredPool().length;$('poolNote').textContent=`${n} yeni soru mevcut • ${category==='all'?'AutoCAD ve SketchUp':category} • ${difficulty==='all'?'tüm seviyeler':difficulty==='easy'?'kolay':difficulty==='medium'?'orta':'zor'}`}function select(selector,attr,val){document.querySelectorAll(selector).forEach(b=>b.classList.toggle('selected',b.getAttribute(attr)===String(val)))}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;select('[data-cat]','data-cat',category);updatePool()});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;select('[data-diff]','data-diff',difficulty);updatePool()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{chosenTime=Number(b.dataset.time);select('[data-time]','data-time',chosenTime)});
function playTone(freq,duration,wave='sine'){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=wave;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.13,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.03)}catch(_){}}function playCorrect(){playTone(660,.17,'triangle');setTimeout(()=>playTone(880,.2,'triangle'),90)}function playWrong(){playTone(220,.28,'sawtooth')}function burstLogo(){const layer=$('confetti');layer.replaceChildren();for(let i=0;i<24;i++){const img=document.createElement('img');img.src='./logo.svg';img.alt='';const a=2*Math.PI*i/24+(Math.random()-.5)*.24,d=120+Math.random()*240;img.style.setProperty('--x',`${Math.cos(a)*d}px`);img.style.setProperty('--y',`${Math.sin(a)*d}px`);img.style.setProperty('--r',`${Math.random()*720-360}deg`);img.style.animationDelay=`${Math.random()*.09}s`;layer.appendChild(img)}setTimeout(()=>layer.replaceChildren(),1900)}function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function startRound(){clearInterval(timerId);clearTimeout(advanceId);let pool=filteredPool();if(pool.length<10){usedIds.clear();pool=filteredPool()}round=shuffle(pool).slice(0,10);round.forEach(q=>usedIds.add(q.id));try{localStorage.setItem('kalecad_seen_questions',JSON.stringify([...usedIds]))}catch(_){}index=0;score=0;correctCount=0;showScreen('quiz');renderQuestion()}function updateTimer(){const n=Math.max(0,seconds);$('timerValue').textContent=n;$('timerRing').style.background=`conic-gradient(var(--cyan) ${n/chosenTime*100}%,#ffffff18 0)`}function options(item){const wrong=shuffle([...new Set(bank.filter(q=>q.category===item.category&&q.answer!==item.answer).map(q=>q.answer))]).slice(0,3);return shuffle([item.answer,...wrong])}function renderQuestion(){clearInterval(timerId);clearTimeout(advanceId);locked=false;seconds=chosenTime;const item=round[index];if(!item)return finishRound();$('qCount').textContent=`Soru ${index+1} / ${round.length}`;$('score').textContent=`Puan: ${score}`;$('question').textContent=item.q;$('feedback').textContent='';$('feedback').className='feedback';$('explainText').textContent='';const wrap=$('answers');wrap.replaceChildren();options(item).forEach(text=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=text;b.onclick=()=>answer(b,text===item.answer,false);wrap.appendChild(b)});updateTimer();timerId=setInterval(()=>{if(locked)return;seconds=Math.max(0,seconds-1);updateTimer();if(seconds===0){clearInterval(timerId);answer(null,false,true)}},1000)}function answer(button,correct,timedOut){if(locked)return;locked=true;clearInterval(timerId);const item=round[index];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===item.answer)b.classList.add('correct')});const gained=correct?10+seconds:0;if(correct){correctCount++;score+=gained;$('feedback').textContent=`Doğru! +${gained} puan`;$('feedback').classList.add('good');burstLogo();playCorrect()}else{if(button)button.classList.add('wrong');$('feedback').textContent=timedOut?'Süre doldu!':'Yanlış cevap';$('feedback').classList.add('bad');playWrong()}$('explainText').textContent=`${correct?'Açıklama':'Doğru cevap'}: ${item.answer}`;$('score').textContent=`Puan: ${score}`;advanceId=setTimeout(()=>{index++;index<round.length?renderQuestion():finishRound()},correct?1700:2300)}function finishRound(){clearInterval(timerId);clearTimeout(advanceId);const key='kalecad_best_score';let best=0;try{best=Number(localStorage.getItem(key)||0)}catch(_){}if(score>best){best=score;try{localStorage.setItem(key,String(best))}catch(_){}}$('roundScore').textContent=score;$('correctCount').textContent=`${correctCount}/${round.length}`;$('bestScore').textContent=best;$('resultText').textContent=`${correctCount} doğru, ${round.length-correctCount} yanlış. ${correctCount>=8?'Harika! CAD bilgin çok iyi.':correctCount>=5?'Güzel gidiyorsun; yeni turda devam et!':'Yeni turda tekrar dene ve rekorunu geliştir!'}`;showScreen('result')}
$('start').onclick=()=>{usedIds.clear();startRound()};$('replay').onclick=startRound;$('homeBtn').onclick=()=>showScreen('home');$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 Ses açık':'🔇 Ses kapalı';$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(soundOn)playTone(660,.12)};$('launchBtn').onclick=()=>{try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(_){}playTone(523,.16,'triangle');$('splash').classList.add('hidden');setTimeout(()=>$('splash').remove(),800)};try{usedIds=new Set(JSON.parse(localStorage.getItem('kalecad_seen_questions')||'[]'))}catch(_){}bank=buildBank();updatePool();
</script>
