<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07163c" />
  <meta name="description" content="KALECAD — CAD bilgi yarışması" />
  <title>KALECAD | CAD Bilgi Yarışması</title>
  <style>
    :root {
      --bg: #07163c;
      --bg-2: #0e204f;
      --panel: rgba(15, 30, 64, 0.96);
      --panel-2: rgba(18, 40, 88, 0.92);
      --line: rgba(205, 220, 255, 0.18);
      --text: #f7f9ff;
      --muted: #c7d3ef;
      --cyan: #64d9ff;
      --green: #7fe0b3;
      --red: #ff9494;
      --yellow: #f5d66f;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(ellipse at 75% 0%, #1a347c 0%, var(--bg) 54%, #040b20 100%);
      color: var(--text);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.2vw, 26px);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 1100px);
      min-height: min(92vh, 900px);
      background: linear-gradient(145deg, rgba(15, 34, 81, 0.98), rgba(6, 17, 46, 0.98));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20, 42, 99, 0.9), rgba(12, 28, 63, 0.8));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .brand-title { font-size: clamp(1.15rem, 1.8vw, 1.9rem); }
    .brand-subtitle {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      opacity: 0.72;
      margin-top: 4px;
    }

    .chip, .btn, .primary {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .chip:hover, .btn:hover, .primary:hover { transform: translateY(-1px); }
    .chip.selected, .primary {
      background: linear-gradient(135deg, #4f74d7, #213b82);
      border-color: rgba(184, 206, 255, 0.9);
    }

    .screen { display: none; padding: clamp(20px, 3vw, 32px); }
    .screen.active { display: block; animation: screenIn 0.4s ease both; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .hero {
      text-align: center;
      padding: 8px 10px 18px;
    }

    .hero-logo {
      width: min(18vw, 150px);
      height: auto;
      margin: 10px auto 12px;
      filter: drop-shadow(0 18px 36px rgba(20, 80, 140, 0.35));
    }

    .hero-eye {
      margin: 0;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-text {
      max-width: 720px;
      margin: 14px auto 0;
      font-size: clamp(1.05rem, 1.4vw, 1.27rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .summary {
      text-align: center;
      margin: 18px auto 0;
      color: var(--muted);
      font-weight: 700;
      min-height: 24px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 6px 0 18px;
      color: var(--muted);
      font-weight: 800;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
    }

    .timer-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
    }

    .timer-badge {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.14);
      background: conic-gradient(var(--cyan) 100%, rgba(255,255,255,.1) 0);
      color: var(--text);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .question {
      margin: 18px 0 12px;
      min-height: 120px;
      font-size: clamp(1.3rem, 2.5vw, 2.2rem);
      line-height: 1.35;
      text-wrap: balance;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .answer {
      width: 100%;
      text-align: left;
      min-height: 72px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      line-height: 1.4;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(191, 209, 255, 0.9);
    }

    .answer.correct {
      background: rgba(127,224,179,0.12);
      border-color: rgba(127,224,179,0.9);
    }

    .answer.wrong {
      background: rgba(255,148,148,0.12);
      border-color: rgba(255,148,148,0.9);
    }

    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 32px;
      margin: 18px 0 8px;
      text-align: center;
      font-weight: 800;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .result-card {
      max-width: 760px;
      margin: 20px auto 0;
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      text-align: center;
    }

    .result-title {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.7rem);
    }

    .result-text {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0 18px;
    }

    .score-box {
      padding: 18px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }

    .score-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    .score-value {
      display: block;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
      margin-top: 8px;
      color: var(--yellow);
    }

    .muted { color: var(--muted); }

    @media (max-width: 720px) {
      .answers { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .stats { flex-direction: column; align-items: flex-start; }
      .score-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">
          <img src="./logo.svg?v=20261115-fix1" alt="KALECAD logo" />
        </div>
        <div>
          <div class="brand-title">KALECAD</div>
          <span class="brand-subtitle">CAD bilgi yarışması</span>
        </div>
      </div>
      <button id="soundToggle" class="btn" type="button" aria-pressed="true">🔊 Ses</button>
    </header>

    <section id="home" class="screen active">
      <div class="hero">
        <img class="hero-logo" src="./logo.svg?v=20261115-fix1" alt="Kale Okulları logo" />
        <p class="hero-eye">AutoCAD &amp; SketchUp</p>
        <p class="hero-text">CAD bilgini sınırla, soru bankası genişlet, her tur yeni sorularla ilerle. Zorluk ve süre ayarları ile oyununu özelleştir.</p>
      </div>

      <div class="row" aria-label="Kategori seçimi">
        <button class="chip selected" data-cat="all" type="button">Hepsi</button>
        <button class="chip" data-cat="AutoCAD" type="button">AutoCAD</button>
        <button class="chip" data-cat="SketchUp" type="button">SketchUp</button>
      </div>

      <div class="row" aria-label="Zorluk seçimi" style="margin-top:12px;">
        <button class="chip selected" data-difficulty="all" type="button">Tümü</button>
        <button class="chip" data-difficulty="easy" type="button">Kolay</button>
        <button class="chip" data-difficulty="medium" type="button">Orta</button>
        <button class="chip" data-difficulty="hard" type="button">Zor</button>
      </div>

      <div class="row" aria-label="Süre seçimi" style="margin-top:12px;">
        <button class="chip selected" data-timer="15" type="button">15 sn</button>
        <button class="chip" data-timer="10" type="button">10 sn</button>
        <button class="chip" data-timer="20" type="button">20 sn</button>
      </div>

      <p id="poolText" class="summary"></p>

      <div class="row" style="margin-top:22px;">
        <button id="startBtn" class="primary" type="button">Oyuna Başla</button>
      </div>
    </section>

    <section id="quiz" class="screen">
      <div class="stats">
        <span id="countText">Soru 1 / 10</span>
        <span id="scoreText">Puan: 0</span>
        <span class="timer-wrap">
          <span>⏱</span>
          <span id="timerBadge" class="timer-badge">15</span>
        </span>
      </div>

      <h2 id="questionText" class="question"></h2>
      <div id="answersWrap" class="answers"></div>
      <p id="feedbackText" class="feedback" aria-live="polite"></p>

      <div class="row" style="margin-top:18px;">
        <button id="nextBtn" class="primary" type="button" style="display:none;">Sonraki Soru</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-card">
        <h2 class="result-title">Tur Tamamlandı!</h2>
        <p id="resultText" class="result-text"></p>

        <div class="score-grid">
          <div class="score-box">
            <span class="score-label">Bu tur</span>
            <span id="roundScore" class="score-value">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Doğru oranı</span>
            <span id="accuracyScore" class="score-value">0%</span>
          </div>
          <div class="score-box">
            <span class="score-label">Rekor</span>
            <span id="bestScore" class="score-value">0</span>
          </div>
        </div>

        <div class="row">
          <button id="replayBtn" class="primary" type="button">Yeni Tur</button>
          <button id="homeBtn" class="btn" type="button">Ana Menü</button>
        </div>
      </div>
    </section>
  </div>

      (n) => `${n} kullanıldığında sistem ne yapar?`,
      (n) => `Bir çizim/modelde ${n} hangi işlevi görür?`,
      (n) => `${n} ifadesiyle en doğru açıklama hangisidir?`,
      (n) => `${n} nedir ve ne işe yarar?`,
      (n) => `${n} hangi işlem için tercih edilir?`,
      (n) => `Aşağıdakilerden hangisi ${n} için doğru tanımdır?`,
      (n) => `${n} işlevi aşağıdakilerden hangisine karşılık gelir?`,
      (n) => `${n} aracının ana görevi nedir?`
    ];

    const state = {
      bank: [],
      selectedCategory: 'all',
      selectedDifficulty: 'all',
      selectedTimer: 15,
      usedIds: new Set(),
      round: [],
      index: 0,
      score: 0,
      rightAnswers: 0,
      locked: false,
      timerId: null,
      soundOn: true,
      currentTimer: 15
    };

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getDifficultyRank(name) {
      const easyNames = ['LINE', 'Move', 'Rotate', 'Paint Bucket', 'Orbit', 'Push/Pull', 'Rectangle', 'Circle', 'Scale'];
      const mediumNames = ['Offset', 'Array', 'View', 'Hatch', 'Mirror', 'Entity Info', 'Text', 'Eraser', 'Follow Me'];
      if (easyNames.includes(name)) return 'easy';
      if (mediumNames.includes(name)) return 'medium';
      return 'hard';
    }

    function buildBank() {
      const bank = [];
      Object.entries(baseQuestions).forEach(([category, items]) => {
        items.forEach(([name, answer], itemIndex) => {
          questionTemplates.forEach((tpl, templateIndex) => {
            bank.push({
              id: `${category}-${itemIndex}-${templateIndex}`,
              category,
              difficulty: getDifficultyRank(name),
              question: tpl(name),
              answer,
              name
            });
          });
        });
      });
      return bank;
    }

    function getFilteredPool() {
      return state.bank.filter((q) => {
        const categoryOK = state.selectedCategory === 'all' || q.category === state.selectedCategory;
        const difficultyOK = state.selectedDifficulty === 'all' || q.difficulty === state.selectedDifficulty;
        const notUsed = !state.usedIds.has(q.id);
        return categoryOK && difficultyOK && notUsed;
      });
    }

    function ensureEnoughPool() {
      const filtered = getFilteredPool();
      if (filtered.length < 10) {
        state.usedIds.clear();
      }
    }

    function updatePoolText() {
      const pool = getFilteredPool();
      const label = state.selectedCategory === 'all' ? 'AutoCAD + SketchUp' : state.selectedCategory;
      const difficultyLabel = state.selectedDifficulty === 'all' ? 'tüm zorluklar' : state.selectedDifficulty;
      document.getElementById('poolText').textContent = `Mevcut havuz: ${pool.length} soru • ${label} • ${difficultyLabel}`;
    }

    function setCategory(cat) {
      state.selectedCategory = cat;
      document.querySelectorAll('[data-cat]').forEach((btn) => {
        btn.classList.toggle('selected', btn.dataset.cat === cat);
      });
      ensureEnoughPool();
      updatePoolText();
    }

    function setDifficulty(diff) {
      state.selectedDifficulty = diff;
      document.querySelectorAll('[data-difficulty]').forEach((btn) => {
        btn.classList.toggle('selected', btn.dataset.difficulty === diff);
      });
      ensureEnoughPool();
      updatePoolText();
    }

    function setTimer(value) {
      state.selectedTimer = Number(value);
      document.querySelectorAll('[data-timer]').forEach((btn) => {
        btn.classList.toggle('selected', Number(btn.dataset.timer) === Number(value));
      });
      state.currentTimer = state.selectedTimer;
      updateTimerBadge();
    }

    function getWrongChoices(correctAnswer, category) {
      const answers = state.bank
        .filter((q) => q.category === category && q.answer !== correctAnswer)
        .map((q) => q.answer);
      const unique = [...new Set(answers)];
      return shuffle(unique).slice(0, 3);
    }

    function updateTimerBadge() {
      const badge = document.getElementById('timerBadge');
      badge.textContent = String(state.currentTimer);
      const ratio = (state.currentTimer / state.selectedTimer) * 100;
      badge.style.background = `conic-gradient(var(--cyan) ${ratio}%, rgba(255,255,255,.1) 0)`;
    }

    function startRound() {
      ensureEnoughPool();
      const pool = getFilteredPool();
      const selected = shuffle(pool).slice(0, Math.min(10, pool.length));
      state.round = selected;
      state.index = 0;
      state.score = 0;
      state.rightAnswers = 0;
      state.usedIds.clear();
      state.round.forEach((q) => state.usedIds.add(q.id));
      document.getElementById('home').classList.remove('active');
      document.getElementById('result').classList.remove('active');
      document.getElementById('quiz').classList.add('active');
      renderQuestion();
    }

    function renderQuestion() {
      state.locked = false;
      clearInterval(state.timerId);
      state.currentTimer = state.selectedTimer;
      updateTimerBadge();

      const q = state.round[state.index];
      if (!q) return finishRound();

      document.getElementById('countText').textContent = `Soru ${state.index + 1} / ${state.round.length}`;
      document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('feedbackText').textContent = '';
      document.getElementById('feedbackText').className = 'feedback';
      document.getElementById('nextBtn').style.display = 'none';

      const answersWrap = document.getElementById('answersWrap');
      answersWrap.innerHTML = '';

      const options = shuffle([q.answer, ...getWrongChoices(q.answer, q.category)]).slice(0, 4);
      options.forEach((option) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer';
        btn.textContent = option;
        btn.disabled = false;
        btn.addEventListener('click', () => handleAnswer(btn, option === q.answer));
        answersWrap.appendChild(btn);
      });

      state.timerId = setInterval(() => {
        if (state.locked) return;
        state.currentTimer = Math.max(0, state.currentTimer - 1);
        updateTimerBadge();
        if (state.currentTimer <= 0) {
          clearInterval(state.timerId);
          revealAnswer(false, true);
        }
      }, 1000);
    }

    function handleAnswer(btn, isCorrect) {
      if (state.locked) return;
      state.locked = true;
      clearInterval(state.timerId);

      const q = state.round[state.index];
      const buttons = [...document.querySelectorAll('.answer')];
      buttons.forEach((b) => {
        b.disabled = true;
        if (b.textContent === q.answer) b.classList.add('correct');
      });

      if (!isCorrect) {
        btn.classList.add('wrong');
      } else {
        state.rightAnswers += 1;
        state.score += 10 + state.currentTimer;
      }

      document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
      if (isCorrect) {
        document.getElementById('feedbackText').textContent = 'Doğru cevap!';
        document.getElementById('feedbackText').classList.add('good');
      } else {
        document.getElementById('feedbackText').textContent = `Yanlış cevap! Doğru cevap: ${q.answer}`;
        document.getElementById('feedbackText').classList.add('bad');
      }

      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function revealAnswer(isCorrect, timedOut) {
      if (state.locked) return;
      state.locked = true;
      clearInterval(state.timerId);

      const q = state.round[state.index];
      const buttons = [...document.querySelectorAll('.answer')];
      buttons.forEach((b) => {
        b.disabled = true;
        if (b.textContent === q.answer) b.classList.add('correct');
      });

      if (isCorrect) {
        state.rightAnswers += 1;
        state.score += 10 + state.currentTimer;
      }

      document.getElementById('scoreText').textContent = `Puan: ${state.score}`;
      document.getElementById('feedbackText').textContent = timedOut
        ? `Süre bitti! Doğru cevap: ${q.answer}`
        : `Doğru cevap!`;
      document.getElementById('feedbackText').classList.add(timedOut ? 'bad' : 'good');
      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function finishRound() {
      clearInterval(state.timerId);
      const total = state.round.length;
      const accuracy = total ? Math.round((state.rightAnswers / total) * 100) : 0;
      const bestKey = 'kalecad-best-score';
      let best = 0;
      try { best = Number(localStorage.getItem(bestKey) || 0); } catch (error) {}
      if (state.score > best) {
        best = state.score;
        try { localStorage.setItem(bestKey, String(best)); } catch (error) {}
      }

      document.getElementById('quiz').classList.remove('active');
      document.getElementById('result').classList.add('active');

      document.getElementById('roundScore').textContent = String(state.score);
      document.getElementById('accuracyScore').textContent = `${accuracy}%`;
      document.getElementById('bestScore').textContent = String(best);

      const message =
        state.rightAnswers >= 8 ? 'Harika! CAD bilgisi çok güçlü.' :
        state.rightAnswers >= 5 ? 'İyi gidiyorsun. Bir sonraki tur daha da gelişecek.' :
        'Tekrar deneyin, her turda yeni sorular çıkacak.';

      document.getElementById('resultText').textContent = `${state.rightAnswers} doğru, ${total - state.rightAnswers} yanlış. ${message}`;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      state.usedIds.clear();
      startRound();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      state.usedIds.clear();
      startRound();
    });

    document.getElementById('homeBtn').addEventListener('click', () => {
      document.getElementById('result').classList.remove('active');
      document.getElementById('home').classList.add('active');
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      state.index += 1;
      if (state.index < state.round.length) {
        renderQuestion();
      } else {
        finishRound();
      }
    });

    document.querySelectorAll('[data-cat]').forEach((btn) => {
      btn.addEventListener('click', () => setCategory(btn.dataset.cat));
    });

    document.querySelectorAll('[data-difficulty]').forEach((btn) => {
      btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
    });

    document.querySelectorAll('[data-timer]').forEach((btn) => {
      btn.addEventListener('click', () => setTimer(btn.dataset.timer));
    });

    document.getElementById('soundToggle').addEventListener('click', () => {
      state.soundOn = !state.soundOn;
      document.getElementById('soundToggle').textContent = state.soundOn ? '🔊 Ses' : '🔇 Sessiz';
      document.getElementById('soundToggle').setAttribute('aria-pressed', String(state.soundOn));
    });

    state.bank = buildBank();
    setCategory('all');
    setDifficulty('all');
    setTimer(15);
    updatePoolText();
  </script>
</body>
</html>
