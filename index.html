<script>
(async function(){

 let html=await response.text();

 /* PLATFORM METİNLERİ */

  '<p>Teknik çizim, üç boyutlu modelleme ve mesleki öğrenme tek platformda.</p>'
 );
 html=html.replace('>Oyuna geç</button>','>Platforma Gir</button>');
 html=html.replace('>Oyuna başla</button>','>Fethetme Oyununa Giriş Yap</button>');

 /* SES VE HAKKIMIZDA DÜĞMELERİ */
 html=html.replace(
  /<button id="soundToggle"[^>]*>[\s\S]*?<\/button>/i,
  function(button){
   return '<div class="ka-header-actions">'+button+
   '<button id="kaAboutBtn" class="btn" type="button">ℹ Hakkımızda</button></div>';
  }
 );

 /* EK STİLLERİ ANA SAYFAYA EKLE */
 const extraCss=document.querySelector('style').textContent;
 html=html.replace('</head>','<style>'+extraCss+'</style></head>');

 /* HAKKIMIZDA PENCERESİ */
 const aboutHtml=`
 <div id="kaAboutPanel">
  <section class="kaAboutBox">
   <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <h2 style="margin:0">KALECAD Hakkında</h2>
    <button id="kaAboutClose" type="button">Kapat</button>
   </div>
   <p><strong>KALECAD</strong>, mimarlık, iç mimarlık ve inşaat teknolojileri alanlarında mesleki öğrenmeyi desteklemek amacıyla hazırlanmış dijital eğitim platformudur.</p>
   <h3>Kale Okulları</h3>
   <p>Kale Okulları, akademik gelişimin yanında öğrencilerin mesleki becerilerini, üretkenliklerini ve uygulama deneyimlerini geliştirmeyi hedefleyen eğitim yaklaşımıyla çalışmalarını sürdürür.</p>
   <h3>Platformun amacı</h3>
   <p>AutoCAD, SketchUp, yapı bilgisi, mimarlık ve iç mimarlık alanlarında öğrenmeyi desteklemek; uygulama, proje ve oyunlaştırılmış öğrenme deneyimleri sunmaktır.</p>
   <p>KALECAD'in geliştirilmesinde GitHub, GitHub Copilot ve ChatGPT gibi dijital araçlardan yararlanılmıştır.</p>
   <p><a href="https://www.kaleokullari.com/" target="_blank" rel="noopener">Kale Okulları resmî web sitesi</a></p>
  </section>
 </div>`;

 const loaderFunction=function(){
 'use strict';

 const VERSION='20261120-v15-full';
 const files=[
  'campus-selection.js',
  'conquest-map.js',
  'autocad-atolye.js',
  'oyun-merkezi.js',
  'mesleki-sozluk.js',
  'kitaplik.js'
 ];

 let started=false;
 let finished=false;

 function loadScript(file){
  return new Promise(function(resolve,reject){
   const script=document.createElement('script');
   script.src='./'+file+'?v='+VERSION;
   script.async=false;
   script.onload=resolve;
   script.onerror=function(){
    reject(new Error(file+' yüklenemedi.'));
   };
   document.body.appendChild(script);
  });
 }

 function waitFor(selector,timeout){
  return new Promise(function(resolve,reject){
   const begin=Date.now();
   const timer=setInterval(function(){
    const element=document.querySelector(selector);
    if(element){
     clearInterval(timer);
     resolve(element);
    }else if(Date.now()-begin>timeout){
     clearInterval(timer);
     reject(new Error(selector+' alanı bulunamadı.'));
    }
   },100);
  });
 }

 function addWorkshopStyles(){
  const style=document.createElement('style');
  style.textContent=`
   #kale-cad-card,#ksBtn,#kaleKitapBtn{display:none!important}
   #ka-home-panel,#ka-news-panel{width:100%;box-sizing:border-box}
  `;
  document.head.appendChild(style);
 }

 function buildWorkshop(map,oldCard){
  const modules=[
   ['01','AutoCAD Akademi','Teknik çizim ve komutlar','auto'],
   ['02','SketchUp Akademi','Üç boyutlu modelleme','sketch'],
   ['03','Mesleki Sözlük','Türkçe ve İngilizce terimler','dictionary'],
   ['04','Kitaplık','Mesleki kaynaklar','library'],
   ['05','Bilgi Yarışması','Bilgini test et','quiz'],
   ['06','Proje Görevleri','Uygulama ve tasarım','tasks'],
   ['07','Çizim Masası','Dijital çizim alanı','draw'],
   ['08','Dijital Araçlar','Çevrim içi tasarım araçları','digital']
  ];

  const panel=document.createElement('section');
  panel.id='ka-home-panel';

  panel.innerHTML=
   '<div class="ka-banner">'+
   '<div class="ka-overline">KALECAD / DIGITAL WORKSHOP</div>'+
   '<h2>DİJİTAL TASARIM ATÖLYESİ</h2>'+
   '<p class="ka-intro">Mimarlık, iç mimarlık ve inşaat teknolojileri için çizim, modelleme ve mesleki öğrenme alanı.</p>'+
   '</div>'+
   '<div class="ka-heading">ATÖLYE BÖLÜMLERİ <span>08 MODÜL</span></div>'+
   '<div class="ka-grid" id="ka-home-grid"></div>';

  const grid=panel.querySelector('#ka-home-grid');

  modules.forEach(function(item){
   const button=document.createElement('button');
   button.type='button';
   button.className='ka-item';
   button.innerHTML=
    '<span class="ka-num">'+item[0]+'</span>'+
    '<span><strong class="ka-name">'+item[1]+'</strong>'+
    '<small class="ka-desc">'+item[2]+'</small></span>';

   button.addEventListener('click',function(){
    if(item[3]==='dictionary'){
     document.getElementById('ksBtn')?.click();
     return;
    }
    if(item[3]==='library'){
     document.getElementById('kaleKitapBtn')?.click();
     return;
    }
    if(!oldCard)return;

    oldCard.click();

    setTimeout(function(){
     const tab=document.querySelector('#kcv2 [data-tab="'+item[3]+'"]');
     if(tab)tab.click();
    },180);
   });

   grid.appendChild(button);
  });

  map.insertAdjacentElement('afterend',panel);
  return panel;
 }

 function cleanText(value){
  const box=document.createElement('div');
  box.innerHTML=value||'';
  return (box.textContent||'').replace(/\s+/g,' ').trim();
 }

 function formatDate(value){
  if(!value)return '';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  return date.toLocaleDateString('tr-TR',{
   day:'2-digit',month:'long',year:'numeric'
  });
 }

 function renderNews(targetId,items,sourceUrl){
  const target=document.getElementById(targetId);
  if(!target)return;
  target.replaceChildren();

  if(!items||!items.length){
   const empty=document.createElement('div');
   empty.className='news-empty';
   empty.textContent='Şu anda haber akışı alınamadı. Kaynağın internet sitesini ziyaret edebilirsin.';
   target.appendChild(empty);

   const link=document.createElement('a');
   link.className='news-item';
   link.href=sourceUrl;
   link.target='_blank';
   link.rel='noopener noreferrer';
   link.textContent='Kaynağın internet sitesini aç';
   target.appendChild(link);
   return;
  }

  items.slice(0,3).forEach(function(item){
   const link=document.createElement('a');
   link.className='news-item';
   link.href=item.link||sourceUrl;
   link.target='_blank';
   link.rel='noopener noreferrer';

   const date=document.createElement('span');
   date.className='news-date';
   date.textContent=formatDate(item.pubDate);

   const title=document.createElement('span');
   title.className='news-title';
   title.textContent=cleanText(item.title)||'Başlıksız haber';

   const description=document.createElement('span');
   description.className='news-description';
   description.textContent=cleanText(item.description||item.content||'').slice(0,190);

   const read=document.createElement('span');
   read.className='news-read';
   read.textContent='Haberi oku';

   link.append(date,title);
   if(description.textContent)link.appendChild(description);
   link.appendChild(read);
   target.appendChild(link);
  });
 }

 async function fetchFeed(feedUrl,sourceUrl,targetId){
  const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feedUrl);
  try{
   const response=await fetch(api,{cache:'no-store'});
   if(!response.ok)throw new Error('Haber servisi yanıt vermedi');
   const data=await response.json();
   if(data.status!=='ok'||!Array.isArray(data.items)){
    throw new Error('Haber akışı okunamadı');
   }
   renderNews(targetId,data.items,sourceUrl);
  }catch(error){
   console.warn('KALECAD haber akışı:',error);
   renderNews(targetId,[],sourceUrl);
  }
 }

 async function loadNews(){
  const button=document.getElementById('ka-news-refresh');
  if(button){
   button.disabled=true;
   button.textContent='HABERLER ALINIYOR...';
  }

  await Promise.all([
   fetchFeed(
    'https://www.arkitera.com/feed/',
    'https://www.arkitera.com/',
    'ka-architecture-news'
   ),
   fetchFeed(
    'https://www.insaatdunyasi.com.tr/feed/',
    'https://www.insaatdunyasi.com.tr/',
    'ka-construction-news'
   )
  ]);

  if(button){
   button.disabled=false;
   button.textContent='HABERLERİ YENİLE';
  }
 }

 async function arrangeHome(){
  const map=await waitFor('#kalecadHistoricMap',15000);
  const oldCard=await waitFor('#kale-cad-card',15000);
  const game=await waitFor('#kaleGamesBtn',15000);
  const settings=await waitFor('.settings',15000);

  addWorkshopStyles();

  const title=document.querySelector('#campusPicker .campus-title .setting-title');
  if(title)title.textContent='SAVUNULACAK KALE';

  /* Kale haritasından sonra oyun ayarları */
  map.insertAdjacentElement('afterend',settings);

  /* Fetih oyunu düğmesi */
  const start=document.getElementById('start');
  if(!start)throw new Error('Fethetme oyunu düğmesi bulunamadı.');

  const actions=start.closest('.actions');
  start.textContent='🏰 Fethetme Oyununa Giriş Yap';
  start.style.display='block';

  if(actions){
   actions.style.display='grid';
   actions.style.width='100%';
   settings.insertAdjacentElement('afterend',actions);
  }

  /* Ayrı CAD Oyun Merkezi */
  game.textContent='CAD Oyununa Giriş Yap';
  if(actions)actions.insertAdjacentElement('afterend',game);
  else settings.insertAdjacentElement('afterend',game);

  /* Dijital Atölye */
  const workshop=buildWorkshop(map,oldCard);
  game.insertAdjacentElement('afterend',workshop);

  /* Haber alanı ve alt bilgi */
  let credit=document.getElementById('kalecad-credit');
  if(!credit){
   credit=document.createElement('footer');
   credit.id='kalecad-credit';
   credit.textContent='KALECAD | Mimarlık • İç Mimarlık • İnşaat Teknolojileri';
  }

  workshop.insertAdjacentElement('afterend',credit);
  buildNews();
 }

 async function startPlatform(){
  if(started||finished)return;
  started=true;

  const status=document.getElementById('kalecad-module-status');
  if(status)status.textContent='Dijital atölyeler ve oyun modülleri yükleniyor...';

  try{
   for(const file of files){
    if(status)status.textContent='Yükleniyor: '+file;
    await loadScript(file);
   }

   await arrangeHome();

   finished=true;
   if(status)status.textContent='';

  }catch(error){
   console.error('KALECAD:',error);
   if(status)status.textContent='Yükleme hatası: '+error.message;
   started=false;
  }
 }

  });
 }

 /* Platforma girişten sonra modülleri yükle */
 const launch=document.getElementById('launchBtn');
 if(launch){
  launch.addEventListener('click',startPlatform,{capture:true});
 }
