<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07163c">
  <meta name="description" content="KALECAD — CAD bilgi yarışması">
  <title>KALECAD | CAD Bilgi Yarışması</title>
</head>
<body>
  <p id="loadingNotice" style="font-family:sans-serif;text-align:center;padding:2rem">KALECAD yükleniyor…</p>
  <script>
    (async function () {
      try {
        const [gameResponse, campusResponse] = await Promise.all([
          fetch('https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html', { cache: 'no-store' }),
          fetch('https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/main/campus-selection.js', { cache: 'no-store' })
        ]);
        if (!gameResponse.ok) throw new Error('Oyun dosyası yüklenemedi (' + gameResponse.status + ').');
        if (!campusResponse.ok) throw new Error('Kampüs seçimi yüklenemedi (' + campusResponse.status + ').');

        const gameHtml = await gameResponse.text();
        const campusCode = await campusResponse.text();
        const safeCampusCode = campusCode.replace(/<\/script/gi, '<\\/script');
        const inlineCampusScript = '<script>' + safeCampusCode + '<\/script>';

        document.open();
        document.write(gameHtml.replace(/<\/body>/i, inlineCampusScript + '<\/body>'));
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font-family:sans-serif;padding:2rem;text-align:center"><h1>KALECAD yüklenemedi</h1><p>' + error.message + '</p><button onclick="location.reload()">Tekrar dene</button></main>';
      }
    })();
  </script>
</body>
</html>
