<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07163c"><title>KALECAD | CAD Bilgi Yarışması</title>
<style>
:root{color-scheme:dark;--bg:#07163c;--panel:#10265a;--line:#ffffff2b;--text:#f7f8fc;--muted:#c5cde0;--cyan:#64d9ff;--green:#83d6b1;--red:#ff918c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Inter,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 75% 0%,#1a347c,var(--bg) 58%,#040b20)}main{width:min(100%,760px);padding:clamp(20px,5vw,42px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#10265af5,#061232f5);box-shadow:0 28px 80px #0007}h1{text-align:center;letter-spacing:.12em;margin:0 0 8px}h2{font-size:clamp(1.35rem,4vw,2rem);line-height:1.4}.sub,.pool,.feedback{text-align:center;color:var(--muted)}.cats,.answers,.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}.btn,button{font:inherit;color:var(--text);background:#ffffff10;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.btn.selected,.primary{background:linear-gradient(135deg,#4665ad,#233e82);border-color:#9bbaff}.primary{min-width:190px}.answers{display:grid;grid-template-columns:1fr 1fr}.answer{text-align:left;min-height:66px}.answer.correct{background:#2b805d;border-color:var(--green)}.answer.wrong{background:#973d4a;border-color:var(--red)}button:disabled{cursor:default;opacity:.8}.stats{display:flex;justify-content:space-between;color:var(--muted);gap:10px}.hidden{display:none!important}.feedback{min-height:30px;font-weight:700}.good{color:var(--green)}.bad{color:var(--red)}@media(max-width:560px){.answers{grid-template-columns:1fr}.cats{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<h1>KALECAD</h1><p class="sub">AutoCAD ve SketchUp bilgi yarışması</p>
<section id="home"><div class="cats" aria-label="Soru kategorisi"><button class="btn selected" data-cat="all">Hepsi</button><button class="btn" data-cat="AutoCAD">AutoCAD</button><button class="btn" data-cat="SketchUp">SketchUp</button></div><p class="pool" id="pool"></p><p class="sub">Her turda 10 farklı soru. Yeni turda önceki turun soruları tekrar etmez.</p><div class="actions"><button class="primary" id="start">Oyuna başla</button></div></section>
<section id="quiz" class="hidden"><div class="stats"><span id="count"></span><span id="score"></span><span id="timer">15 sn</span></div><h2 id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary hidden" id="next">Sonraki soru</button></div></section>
<section id="result" class="hidden"><h2>Tur tamamlandı!</h2><p class="sub" id="resultText"></p><div class="actions"><button class="primary" id="replay">Yeni tur (yeni sorular)</button><button class="btn" id="homeBtn">Ana menü</button></div></section>
</main>
<script>
// Her konu için 20 bilgi x 10 ayrı soru kalıbı = kategori başına 200 soru.
const facts={
AutoCAD:[
['LINE','İki veya daha fazla nokta arasında düz çizgi çizer.'],['PLINE','Bağlı çizgi ve yay parçalarını tek bir çoklu çizgi nesnesi olarak oluşturur.'],['CIRCLE','Merkez ve yarıçap ya da çap bilgisiyle daire çizer.'],['ARC','Bir daire yayının belirlenen bölümünü oluşturur.'],['RECTANG','Dikdörtgeni tek bir kapalı çoklu çizgi olarak oluşturur.'],['POLYGON','Belirlenen kenar sayısına sahip düzgün çokgen çizer.'],['MOVE','Seçilen nesneleri bir konumdan başka bir konuma taşır.'],['COPY','Seçilen nesnelerin bir veya daha fazla kopyasını oluşturur.'],['ROTATE','Seçilen nesneleri bir taban noktası çevresinde döndürür.'],['SCALE','Seçilen nesnelerin boyutunu bir ölçek katsayısıyla değiştirir.'],['MIRROR','Seçilen nesnelerin belirlenen eksene göre simetrik kopyasını oluşturur.'],['OFFSET','Bir nesneye belirli mesafede paralel ya da eş merkezli kopya oluşturur.'],['TRIM','Nesneleri seçilen kesme sınırlarına göre kırpar.'],['EXTEND','Nesneleri seçilen sınırlara kadar uzatır.'],['FILLET','İki nesne arasına belirlenen yarıçapta yuvarlatılmış geçiş ekler.'],['CHAMFER','İki nesnenin köşesini belirlenen mesafelerle pah kırarak birleştirir.'],['ARRAY','Nesnelerin dikdörtgensel, dairesel veya yol boyunca çoğaltılmış düzenini oluşturur.'],['EXPLODE','Bileşik nesneyi onu oluşturan daha basit bileşenlere ayırır.'],['JOIN','Birbirine bağlı uygun çizgi veya yay parçalarını tek nesnede birleştirir.'],['HATCH','Kapalı alanları tarama deseni, düz dolgu veya gradyanla doldurur.']],
SketchUp:[
['Push/Pull','Bir yüzeyi itip çekerek 3B hacim veya girinti oluşturur.'],['Orbit','Kamerayı modelin çevresinde döndürerek farklı açılardan görünüm sağlar.'],['Pan','Kamerayı döndürmeden görünümü yatay veya dikey kaydırır.'],['Zoom Extents','Modeldeki tüm geometriyi görünür alana sığdırır.'],['Tape Measure','Mesafeleri ölçer; ayrıca kılavuz çizgileri ve ölçü kılavuzları oluşturabilir.'],['Move','Seçilen geometriyi taşır; Ctrl/Option ile kopyalama yapılabilir.'],['Rotate','Geometriyi seçilen bir merkez ve eksen çevresinde döndürür.'],['Scale','Seçilen geometriyi ölçek tutamaçlarıyla büyütür veya küçültür.'],['Follow Me','Bir yüz profili seçilen yol boyunca süpürerek 3B biçim oluşturur.'],['Offset','Bir yüzün kenarlarından eşit uzaklıklı iç veya dış kontur oluşturur.'],['Paint Bucket','Yüzlere renk, malzeme veya doku uygular.'],['Eraser','Kenarları siler; bağlı yüzler arasındaki yumuşatma görünümünü düzenleyebilir.'],['Rectangle','Dört kenarlı dikdörtgen yüz ve kenarlar oluşturur.'],['Line','Kenar çizer; kapalı çevrim tamamlandığında yüz oluşmasına yardımcı olur.'],['Arc','Yay ve yay tabanlı kenar geometrisi oluşturur.'],['Make Component','Geometriyi yeniden kullanılabilir, kendine ait özellikleri olan bileşene dönüştürür.'],['Make Group','Geometriyi diğer model geometrisinden yalıtan bir grup oluşturur.'],['Outliner','Modeldeki grup ve bileşenlerin hiyerarşisini listeler ve seçmeye yarar.'],['Tags','Gruplara ve bileşenlere görünürlük yönetimi için etiket atamaya yarar.'],['Scenes','Kamera görünümü ve görünürlük gibi model durumlarını kaydedip sunumda kullanır.']]
};
const forms=[
 (n)=>`${n} komutu/aracı ne işe yarar?`,
 (n)=>`${n} kullanıldığında modelde hangi işlem yapılır?`,
 (n)=>`Hangi işlev ${n} ile gerçekleştirilir?`,
 (n)=>`${n} aracının temel amacı nedir?`,
 (n)=>`Bir çizimde/modelde ${n} ne sağlar?`,
 (n)=>`${n} seçeneği hangi sonucu oluşturur?`,
 (n)=>`${n} hangi tür düzenleme için kullanılır?`,
 (n)=>`${n} ile ilgili doğru açıklama hangisidir?`,
 (n)=>`Hangi araç/komut: ${n}?`,
 (n)=>`${n} aracını kullandığınızda ne elde edersiniz?`
];
const questions=[];
for(const [category,items] of Object.entries(facts)) items.forEach(([name,answer],i)=>forms.forEach((make,j)=>questions.push({id:`${category}-${i}-${j}`,category,q:make(name),a:answer,answerIndex:i})));
const $=id=>document.getElementById(id);let category='all',round=[],lastRoundIds=new Set(),index=0,score=0,locked=false,timerId=null,seconds=15;
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function pool(){return questions.filter(q=>category==='all'||q.category===category)}
function updatePool(){const n=pool().length;$('pool').textContent=`Seçili havuzda ${n} soru bulunuyor (${category==='all'?'100 AutoCAD + 100 SketchUp':'200 '+category}).`}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('selected',x===b));lastRoundIds.clear();updatePool()});
function start(){clearInterval(timerId);const available=pool().filter(q=>!lastRoundIds.has(q.id));round=shuffle(available.length>=10?available:pool()).slice(0,10);lastRoundIds=new Set(round.map(q=>q.id));index=0;score=0;$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;seconds=15;$('count').textContent=`Soru ${index+1} / ${round.length}`;$('score').textContent=`Puan: ${score}`;$('question').textContent=round[index].q;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');const correct=round[index].a;const distractors=shuffle(facts[round[index].category].filter(x=>x[1]!==correct).map(x=>x[1])).slice(0,3);shuffle([correct,...distractors]).forEach(text=>{const b=document.createElement('button');b.className='answer';b.textContent=text;b.onclick=()=>choose(b,text===correct);$('answers').appendChild(b)});startTimer()}
function startTimer(){clearInterval(timerId);$('timer').textContent=`${seconds} sn`;timerId=setInterval(()=>{seconds--; $('timer').textContent=`${seconds} sn`;if(seconds<=0){clearInterval(timerId);choose(null,false,true)}},1000)}
function choose(button,correct,timeout=false){if(locked)return;locked=true;clearInterval(timerId);document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===round[index].a)b.classList.add('correct')});if(button&&!correct)button.classList.add('wrong');if(correct)score++;$('score').textContent=`Puan: ${score}`;$('feedback').textContent=timeout?`Süre bitti! Doğru cevap: ${round[index].a}`:correct?'Doğru cevap!':'Yanlış cevap. Doğru cevap: '+round[index].a;$('feedback').classList.add(correct?'good':'bad');$('next').classList.remove('hidden')}
$('next').onclick=()=>{if(++index<round.length)render();else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').textContent:`${round.length} soruda ${score} doğru cevap.`}};
$('start').onclick=start;$('replay').onclick=start;$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};updatePool();
</script></body></html>
