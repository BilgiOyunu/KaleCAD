<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07163c" />
  <meta name="description" content="KALECAD — AutoCAD ve SketchUp bilgi yarışması" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261115-fix1" />
  <title>KALECAD | CAD Bilgi Yarışması</title>
  <style>
    :root{color-scheme:dark;--bg:#07163c;--line:rgba(190,204,235,.24);--text:#f7f8fc;--muted:#c5cde0;--green:#83d6b1;--red:#ff918c;--cyan:#64d9ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 75% 0%,#1a347c 0%,var(--bg) 54%,#040b20 100%);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:clamp(10px,2.3vw,24px);position:relative;overflow-x:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0}body:before{width:460px;height:460px;right:-120px;top:-80px;background:rgba(84,122,228,.8)}body:after{width:420px;height:420px;left:-140px;bottom:-60px;background:rgba(44,115,180,.7)}
    .app{position:relative;z-index:1;width:min(100%,1100px);min-height:min(92vh,900px);background:linear-gradient(145deg,rgba(14,31,78,.97),rgba(6,18,50,.98));border:1px solid var(--line);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.38);overflow:hidden;isolation:isolate}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,42,99,.9),rgba(12,29,75,.68));animation:headerIn .6s ease both}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo-mark{width:54px;height:54px;border-radius:13px;border:1px solid rgba(220,228,245,.5);overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.25);flex:none}.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}h1{margin:0;font:700 clamp(1.3rem,3vw,2rem)/1 Georgia,"Times New Roman",serif;letter-spacing:.1em}.brand-subtitle{display:block;margin-top:5px;color:#d7dced;font:700 .58rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:.17em}.header-right{display:flex;align-items:center;gap:8px}.tag,.sound-toggle{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-size:.76rem;white-space:nowrap;font-weight:700}.sound-toggle{font:inherit;cursor:pointer}.sound-toggle[aria-pressed=true]{color:#fff;border-color:rgba(220,228,245,.55);background:rgba(255,255,255,.12)}
    .screen{display:none;padding:clamp(18px,3vw,32px)}.screen.active{display:block;animation:screenIn .42s ease both}.hero{text-align:center;padding:8px 10px 6px}.hero-logo-wrap{display:grid;place-items:center;margin:0 auto;width:100%;animation:heroIn .8s cubic-bezier(.18,.8,.25,1) both}.hero-logo{display:block;width:min(100%,560px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(1,8,28,.32));border-radius:24px;animation:logoFloat 5s ease-in-out infinite}.eyebrow{margin:12px 0 8px;color:#dce3f2;letter-spacing:.16em;font-weight:900;font-size:.72rem}.hero p{margin:12px auto 0;max-width:650px;font-size:1.02rem;line-height:1.6;color:var(--muted)}
    .category-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}.btn,.primary{appearance:none;border:1px solid rgba(220,228,245,.2);background:rgba(255,255,255,.045);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;transition:140ms ease;touch-action:manipulation}.btn:hover,.primary:hover{transform:translateY(-2px);border-color:rgba(220,228,245,.68);box-shadow:0 0 20px rgba(116,151,226,.2)}.btn.selected{background:linear-gradient(180deg,rgba(80,111,183,.55),rgba(48,73,139,.35));border-color:rgba(205,216,240,.55);box-shadow:0 0 0 1px rgba(190,204,235,.16)}.primary{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:14px 22px;border:1px solid rgba(232,237,248,.42);border-radius:14px;background:linear-gradient(135deg,#4665ad,#233e82);color:#fff;font-weight:900;letter-spacing:.04em;box-shadow:0 12px 26px rgba(5,14,43,.35)}
    .center-button{display:flex;justify-content:center;margin-top:22px}.pool-note{text-align:center;margin:18px 0 0;color:var(--muted);font-size:.82rem}.stats{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:.94rem;font-weight:700}.track{width:100%;height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:14px 0 20px}.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#aebbd8,#4969b1);transition:width 350ms ease}.timer{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.035);font-weight:800;color:var(--muted)}.timer-ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) 100%,rgba(255,255,255,.08) 0)}.timer-ring span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#0b1c4d;color:#fff;font-size:.75rem}.quiz-heading{display:flex;align-items:center;gap:14px;margin:17px 0}.guide{width:62px;height:62px;flex:none;filter:drop-shadow(0 7px 14px rgba(0,0,0,.28));animation:guideBob 2.4s ease-in-out infinite}.guide-face{transform-origin:center;animation:faceBlink 4.2s infinite}.question{margin:0;font-size:clamp(1.35rem,3vw,2.05rem);line-height:1.38}.answers{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.answer{display:block;width:100%;min-height:68px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;line-height:1.4;transition:140ms ease}.answer:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(213,223,243,.7);background:rgba(166,184,222,.12)}.answer.correct{background:rgba(89,190,145,.2);border-color:rgba(131,214,177,.8);animation:correctPop .38s ease}.answer.wrong{background:rgba(255,125,115,.18);border-color:rgba(255,145,140,.7);animation:wrongShake .35s ease}.answer:disabled{cursor:default;opacity:1}.feedback{min-height:28px;margin:18px 0 0;font-weight:800;line-height:1.5;font-size:1.02rem}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}
    .result-title{text-align:center;margin:4px 0 20px}.score-card{position:relative;overflow:hidden;margin:12px auto 22px;max-width:700px;padding:clamp(20px,5vw,38px);text-align:center;border-radius:22px;border:1px solid rgba(203,216,241,.38);background:linear-gradient(145deg,rgba(59,83,147,.42),rgba(9,24,66,.72));box-shadow:0 20px 50px rgba(0,0,0,.22);animation:scoreReveal .7s cubic-bezier(.17,.8,.25,1) both}.score-emblem{position:relative;width:84px;height:84px;margin:0 auto 12px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:emblemBounce .7s .25s both}.score-emblem img{width:100%;height:100%;object-fit:cover}.score-label{margin:0;color:var(--muted);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem}.score-value{margin:4px 0;font-size:clamp(3.2rem,10vw,6.3rem);line-height:1;font-weight:900;letter-spacing:-.06em;background:linear-gradient(180deg,#fff,#b8c8ed);color:transparent;background-clip:text}.score-detail{color:var(--muted);margin:8px 0 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat-tile{padding:14px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);text-align:center}.stat-tile b{display:block;font-size:1.35rem;margin-top:4px}.level{margin:16px 0;padding:18px;border-radius:16px;border:1px solid rgba(190,204,235,.38);background:rgba(28,51,112,.48);line-height:1.6;text-align:center}.level strong{color:#e4e9f4;font-size:1.35rem}
    .celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.particle{position:absolute;left:50%;top:50%;width:clamp(34px,6vw,66px);height:clamp(34px,6vw,66px);object-fit:cover;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.35);animation:logoBurst 1.65s cubic-bezier(.12,.72,.24,1) forwards}.particle.spark{width:9px;height:15px;border-radius:4px;box-shadow:none;animation:confettiBurst 1.45s ease-out forwards}
    @keyframes heroIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@keyframes headerIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes guideBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes faceBlink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}@keyframes correctPop{50%{transform:scale(1.025)}}@keyframes wrongShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes scoreReveal{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes emblemBounce{0%{transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0)}}@keyframes logoBurst{0%{transform:translate(-50%,-50%) scale(.12);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.82) rotate(var(--r));opacity:0}}@keyframes confettiBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
    @media(max-width:700px){.header{padding:11px 13px}.logo-mark{width:46px;height:46px}.answers{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch}.controls .btn,.controls .primary{width:100%}.tag{display:none}.screen{padding:20px 16px}.hero-logo{width:min(100%,400px)}.quiz-heading{align-items:flex-start}.guide{width:52px;height:52px}.result-grid{gap:7px}.stat-tile{padding:12px 6px;font-size:.85rem}.stat-tile b{font-size:1.2rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header"><div class="brand"><div class="logo-mark"><img src="./logo.svg?v=20261115-fix1" alt="Kale Okulları logosu" /></div><div><h1>KALECAD</h1><span class="brand-subtitle">KALE OKULLARI</span></div></div><div class="header-right"><span class="tag">AutoCAD • SketchUp</span><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="Ses efektlerini aç">🔇 Ses</button></div></header>
    <section id="home" class="screen active"><div class="hero"><div class="hero-logo-wrap"><img class="hero-logo" src="./logo.svg?v=20261115-fix1" alt="Kale Okulları logosu: kale simgesi ve KALE OKULLARI yazısı" /></div><p class="eyebrow">KALE OKULLARI • ÇİZİM BİLGİSİ</p><p>CAD bilginizi test edin; doğru cevapları toplayıp KALECAD rekorunuzu kırın.</p></div><div class="category-row" aria-label="Kategori seçimi"><button class="btn selected" data-cat="all" type="button">Karışık</button><button class="btn" data-cat="AutoCAD" type="button">AutoCAD</button><button class="btn" data-cat="SketchUp" type="button">SketchUp</button></div><p class="pool-note" id="poolNote"></p><div class="center-button"><button class="primary" id="start" type="button">Oyuna başla</button></div></section>
    <section id="quiz" class="screen"><div class="stats"><span id="qCount">Soru 1 / 10</span><span id="score">Puan: 0</span></div><div class="timer"><span>⏱ Süre</span><div class="timer-ring" id="timerRing"><span id="timerValue">15</span></div></div><div class="track" aria-label="Tur ilerlemesi"><div class="bar" id="bar"></div></div><div class="quiz-heading"><svg class="guide" viewBox="0 0 100 100" role="img" aria-label="KaleCAD oyun rehberi"><path d="M14 82V39h13V23h15v16h16V23h15v16h13v43Z" fill="#8d9dc3" stroke="#e8edf8" stroke-width="3"/><path d="M40 82V65a10 10 0 0 1 20 0v17" fill="#172e6b" stroke="#e8edf8" stroke-width="3"/><g class="guide-face" fill="#fff"><ellipse cx="40" cy="52" rx="4" ry="6"/><ellipse cx="60" cy="52" rx="4" ry="6"/><path d="M43 64q7 6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></svg><h2 class="question" id="question"></h2></div><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="controls"><button class="primary hidden" id="next" type="button">Sonraki soru</button><button class="btn" data-home type="button">Ana menü</button></div></section>
    <section id="result" class="screen"><h2 class="result-title">🏁 Tur tamamlandı!</h2><div class="score-card"><div class="score-emblem"><img src="./logo.svg?v=20261115-fix1" alt="Kale Okulları" /></div><p class="score-label">Tur puanın</p><div class="score-value" id="scoreValue">0</div><p class="score-detail" id="scoreDetail"></p><div class="result-grid"><div class="stat-tile">Doğru<b id="correctCount">0</b></div><div class="stat-tile">Yanlış<b id="wrongCount">0</b></div><div class="stat-tile">Başarı<b id="accuracy">0%</b></div></div></div><div class="level" id="levelText"></div><p class="pool-note">Rekor: <strong id="bestStat">0</strong></p><div class="center-button"><button class="primary" id="replay" type="button">Tekrar oyna</button></div><div class="center-button"><button class="btn" data-home type="button">Ana menü</button></div></section>
  </main>
  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <script>
    const questions=[
      {category:'AutoCAD',q:'LINE komutu ne işe yarar?',a:'İki veya daha fazla nokta arasında düz çizgi çizer.',o:['İki veya daha fazla nokta arasında düz çizgi çizer.','Kapalı alanı tarar.','Nesneleri döndürür.','Ölçü ekler.']},
      {category:'AutoCAD',q:'PLINE komutu hangi nesneyi oluşturur?',a:'Birbirine bağlı çizgi ve yay parçalarından tek bir çoklu çizgi oluşturur.',o:['Birbirine bağlı çizgi ve yay parçalarından tek bir çoklu çizgi oluşturur.','Daire çizer.','Katman siler.','Görünümü yakınlaştırır.']},
      {category:'AutoCAD',q:'CIRCLE komutu ne için kullanılır?',a:'Merkezi ve yarıçapı/çapı belirlenen daire çizer.',o:['Merkezi ve yarıçapı/çapı belirlenen daire çizer.','Yay çizer.','Dikdörtgen çizer.','Nesneyi aynalar.']},
      {category:'AutoCAD',q:'MOVE komutu ne yapar?',a:'Seçili nesneleri belirlenen konuma taşır.',o:['Seçili nesneleri belirlenen konuma taşır.','Nesneleri kopyalar.','Nesneleri siler.','Nesneleri büyütür.']},
      {category:'AutoCAD',q:'OFFSET komutu hangi amaçla kullanılır?',a:'Bir nesneye belirli mesafede paralel kopya oluşturur.',o:['Bir nesneye belirli mesafede paralel kopya oluşturur.','Nesneleri döndürür.','Çizimi kaydeder.','Alanı hesaplar.']},
      {category:'AutoCAD',q:'TRIM komutu ne işe yarar?',a:'Nesneleri kesme sınırlarında kırpar.',o:['Nesneleri kesme sınırlarında kırpar.','Nesneleri uzatır.','Katmanları birleştirir.','Yazı ekler.']},
      {category:'AutoCAD',q:'MIRROR komutu hangi işlemi yapar?',a:'Nesnelerin belirlenen eksene göre simetriğini oluşturur.',o:['Nesnelerin belirlenen eksene göre simetriğini oluşturur.','Nesneleri taşır.','Yay oluşturur.','Çizgi kalınlığını ayarlar.']},
      {category:'AutoCAD',q:'HATCH komutunun görevi nedir?',a:'Kapalı alanı tarama veya dolgu ile doldurur.',o:['Kapalı alanı tarama veya dolgu ile doldurur.','Nesneyi patlatır.','Ölçü alır.','Görünümü kaydırır.']},
      {category:'AutoCAD',q:'OSNAP ne sağlar?',a:'Nokta, merkez ve kesişim gibi hassas noktalara yakalar.',o:['Nokta, merkez ve kesişim gibi hassas noktalara yakalar.','Çizimi dışa aktarır.','Nesneleri renklendirir.','Katman oluşturur.']},
      {category:'AutoCAD',q:'LAYER komutu neyi yönetir?',a:'Çizim katmanlarını yönetir.',o:['Çizim katmanlarını yönetir.','Daireleri düzenler.','Ölçekli çıktı alır.','Yazı tipini değiştirir.']},
      {category:'SketchUp',q:'Push/Pull aracı ne yapar?',a:'Yüzeyi itip çekerek 3B hacim veya girinti oluşturur.',o:['Yüzeyi itip çekerek 3B hacim veya girinti oluşturur.','Kamerayı döndürür.','Nesne rengini seçer.','Ölçü çizgisi ekler.']},
      {category:'SketchUp',q:'Orbit aracı ne için kullanılır?',a:'Kamerayı model etrafında döndürür.',o:['Kamerayı model etrafında döndürür.','Geometriyi siler.','Yüzeye doku uygular.','Modeli gruplar.']},
      {category:'SketchUp',q:'Tape Measure aracı ne yapar?',a:'Mesafeleri ölçer ve kılavuz oluşturur.',o:['Mesafeleri ölçer ve kılavuz oluşturur.','Yüzeyi yükseltir.','Gölge ekler.','Modeli dışa aktarır.']},
      {category:'SketchUp',q:'Make Group neden kullanılır?',a:'Geometriyi gruplayıp diğerlerinden ayırır.',o:['Geometriyi gruplayıp diğerlerinden ayırır.','Modeli aynalar.','Kamerayı yakınlaştırır.','Doku oluşturur.']},
      {category:'SketchUp',q:'Zoom Extents komutu ne sağlar?',a:'Tüm modeli ekrana sığdırır.',o:['Tüm modeli ekrana sığdırır.','Modeli kilitler.','Yeni sahne oluşturur.','Kesit düzlemi ekler.']},
      {category:'SketchUp',q:'Paint Bucket aracı hangi iş için kullanılır?',a:'Yüzeylere renk, malzeme veya doku uygular.',o:['Yüzeylere renk, malzeme veya doku uygular.','Kenarları yumuşatır.','Nesneyi taşır.','Kamerayı konumlandırır.']},
      {category:'SketchUp',q:'Scenes özelliği neyi kaydeder?',a:'Kamera ve görünüm durumlarını kaydeder.',o:['Kamera ve görünüm durumlarını kaydeder.','Malzeme kütüphanesini siler.','Nesne alanını ölçer.','Katı hacimleri çıkarır.']},
      {category:'SketchUp',q:'Follow Me aracı hangi sonucu üretir?',a:'Profili yol boyunca süpürerek 3B biçim oluşturur.',o:['Profili yol boyunca süpürerek 3B biçim oluşturur.','Çizgileri paralel kopyalar.','Kamerayı model içine taşır.','Etiketleri sıralar.']},
      {category:'SketchUp',q:'Eraser aracı ne yapar?',a:'Kenarları siler veya yumuşatır.',o:['Kenarları siler veya yumuşatır.','Katı hacmi birleştirir.','Yüzeyi döndürür.','Sahne kaydeder.']},
      {category:'SketchUp',q:'Section Plane ne için kullanılır?',a:'Modeli incelemek için kesit düzlemi oluşturur.',o:['Modeli incelemek için kesit düzlemi oluşturur.','Görünümü yakınlaştırır.','Yüzeylere renk verir.','Geometriyi kopyalar.']}
    ];
    const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
    const normalizeAnswer=s=>String(s??'').normalize('NFC').replace(/[\s\u00a0]+/g,' ').trim().toLocaleLowerCase('tr-TR');
    let category='all',list=[],index=0,points=0,locked=false,soundOn=false,audioContext=null,currentTimer=15,timerId=null;
    const $=id=>document.getElementById(id),screens=[...document.querySelectorAll('.screen')];
    function showScreen(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}
    function updatePoolNote(){$('poolNote').textContent=`${questions.filter(x=>category==='all'||x.category===category).length} soru • ${category==='all'?'AutoCAD ve SketchUp':category}`;}
    function setCategory(cat){category=cat;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('selected',b.dataset.cat===cat));updatePoolNote();}
    function startQuiz(){clearInterval(timerId);list=shuffle(questions.filter(x=>category==='all'||x.category===category)).slice(0,10);index=0;points=0;showScreen('quiz');renderQuestion();}
    function updateTimer(){const t=Math.max(0,Math.ceil(currentTimer));$('timerValue').textContent=t;const percent=Math.max(0,(t/15)*100);$('timerRing').style.background=`conic-gradient(var(--cyan) ${percent}%,rgba(255,255,255,.08) 0)`;}
    function startTimer(){clearInterval(timerId);currentTimer=15;updateTimer();timerId=setInterval(()=>{if(!list.length||!$('quiz').classList.contains('active'))return;currentTimer-=.25;if(currentTimer<=0){currentTimer=0;updateTimer();clearInterval(timerId);handleTimeout();return;}updateTimer();},250);}
    function renderQuestion(){locked=false;const item=list[index];$('qCount').textContent=`Soru ${index+1} / ${list.length}`;$('question').textContent=item.q;$('score').textContent=`Puan: ${points}`;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('bar').style.width=`${index/list.length*100}%`;const wrap=$('answers');wrap.replaceChildren();shuffle(item.o).forEach(option=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=option;b.dataset.isCorrect=String(normalizeAnswer(option)===normalizeAnswer(item.a));b.addEventListener('click',()=>chooseAnswer(b));wrap.appendChild(b);});startTimer();}
    function playTone(correct){if(!soundOn)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type='sine';osc.frequency.setValueAtTime(correct?660:220,now);osc.frequency.exponentialRampToValueAtTime(correct?990:150,now+.18);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.12,now+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+.24);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.25);}catch{}}
    function logoBurst(){const layer=$('celebration');layer.replaceChildren();const colors=['#dce4f4','#aebbd8','#7c89ac','#eef2fa','#4969b1'];for(let i=0;i<36;i++){const isLogo=i%3===0,p=document.createElement(isLogo?'img':'span');p.className=`particle${isLogo?'':' spark'}`;p.style.setProperty('--x',`${(Math.random()-.5)*Math.min(innerWidth*.95,920)}px`);p.style.setProperty('--y',`${(Math.random()-.5)*Math.min(innerHeight*.85,650)}px`);p.style.setProperty('--r',`${(Math.random()-.5)*900}deg`);if(isLogo){p.src='./logo.svg?v=20261115-fix1';p.alt='';}else p.style.background=colors[i%colors.length];layer.appendChild(p);}window.setTimeout(()=>layer.replaceChildren(),1800);}
    function markAnswers(correct){document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.isCorrect==='true')b.classList.add('correct');});}
    function handleTimeout(){if(locked)return;locked=true;const item=list[index];markAnswers();const f=$('feedback');f.textContent=`⏰ Süre bitti! Doğru cevap: ${item.a}`;f.classList.add('bad');playTone(false);$('next').classList.remove('hidden');}
    function chooseAnswer(button){if(locked)return;locked=true;clearInterval(timerId);const correct=button.dataset.isCorrect==='true';markAnswers();if(!correct)button.classList.add('wrong');const item=list[index],f=$('feedback');if(correct){points++;f.textContent='✓ Doğru! Harika iş!';f.classList.add('good');logoBurst();}else{f.textContent=`Yanlış! Doğru cevap: ${item.a}`;f.classList.add('bad');}playTone(correct);$('score').textContent=`Puan: ${points}`;$('next').classList.remove('hidden');}
    function finishRound(){clearInterval(timerId);const total=list.length,wrong=total-points,ratio=Math.round(points/total*100),key='kalecad_best_blue',best=Math.max(Number(localStorage.getItem(key)||0),points);localStorage.setItem(key,String(best));$('correctCount').textContent=points;$('wrongCount').textContent=wrong;$('accuracy').textContent=`${ratio}%`;$('bestStat').textContent=best;$('scoreValue').textContent=points;$('scoreDetail').textContent=`${total} soruda ${points} doğru cevap • Başarı oranı %${ratio}`;$('levelText').innerHTML=ratio>=80?'<strong>🏆 CAD Uzmanı</strong><br>Harika! Bilgin ve dikkatin çok güçlü.':ratio>=50?'<strong>👏 Güzel ilerleme</strong><br>Biraz daha pratikle uzmanlığa ulaşabilirsin.':'<strong>🚀 Pratiğe devam!</strong><br>Yeni bir turla rekorunu geliştirebilirsin.';showScreen('result');}
    $('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').setAttribute('aria-pressed',String(soundOn));$('soundToggle').textContent=soundOn?'🔊 Ses açık':'🔇 Ses';$('soundToggle').setAttribute('aria-label',soundOn?'Ses efektlerini kapat':'Ses efektlerini aç');if(soundOn)playTone(true);});
    document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.cat)));document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{clearInterval(timerId);showScreen('home');}));$('start').addEventListener('click',startQuiz);$('replay').addEventListener('click',startQuiz);$('next').addEventListener('click',()=>{if(index+1<list.length){index++;renderQuestion();}else finishRound();});setCategory('all');updatePoolNote();showScreen('home');
  </script>
</body>
