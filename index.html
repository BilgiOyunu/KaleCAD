<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07163c">
  <meta name="description" content="KALECAD — CAD bilgi yarışması">
  <title>KALECAD | CAD Bilgi Yarışması</title>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;padding:2rem">KALECAD yükleniyor…</p>
  <script>
    (async function () {
      try {
        const response = await fetch('https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Oyun dosyası yüklenemedi (' + response.status + ').');
        let gameHtml = await response.text();
        const additions = '<script src="./campus-selection.js?v=28c5626"></scr' + 'ipt><script src="./question-bank.js?v=6d387af"></scr' + 'ipt><script src="./conquest-map.js?v=2"></scr' + 'ipt><script src="./autocad-atolye.js?v=1"></scr' + 'ipt>';
        if (!/<\/body>/i.test(gameHtml)) throw new Error('Oyun HTML dosyasında body kapanışı bulunamadı.');
        gameHtml = gameHtml.replace(/<\/body>/i, additions + '</body>');
        document.open();
        document.write(gameHtml);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font-family:sans-serif;padding:2rem;text-align:center"><h1>KALECAD yüklenemedi</h1><p>' + error.message + '</p><button onclick="location.reload()">Tekrar dene</button></main>';
      }
    })();
  </script>
</body>
</html>
