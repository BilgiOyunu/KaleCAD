<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07163c"><meta name="description" content="KALECAD — CAD bilgi yarışması"><title>KALECAD | CAD Bilgi Yarışması</title>
<style>
:root{color-scheme:dark;--bg:#07163c;--line:#ffffff2e;--text:#f7f8fc;--muted:#c5cde0;--cyan:#64d9ff;--green:#83d6b1;--red:#ff918c;--gold:#f5d66f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 75% 0%,#1a347c,var(--bg) 55%,#040b20);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:16px}.app{position:relative;width:min(100%,1000px);min-height:min(90vh,850px);overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#10234feF,#061232f5);box-shadow:0 28px 80px #0007}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.brand img{width:48px;height:48px;object-fit:cover;border-radius:12px}.sub{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.15em;margin-top:3px}.screen{display:none;padding:clamp(18px,3vw,32px)}.screen.active{display:block}.hero{text-align:center;padding:8px 10px 12px}.hero img{width:min(34vw,180px);max-height:150px;object-fit:contain;filter:drop-shadow(0 10px 22px #0006)}h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:8px 0}.hero p,.summary{text-align:center;color:var(--muted);line-height:1.55}.row,.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}.btn,.primary,.chip{font:inherit;color:var(--text);font-weight:750;border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#ffffff0b;cursor:pointer}.primary,.chip.selected{background:linear-gradient(135deg,#4665ad,#233e82);border-color:#b7caff}.btn:hover,.primary:hover,.chip:hover{filter:brightness(1.15)}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:750;border:1px solid var(--line);border-radius:12px;padding:11px 14px}.timer{display:flex;align-items:center;gap:9px}.timer-ring{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--cyan) 100%,#ffffff18 0)}.timer-ring span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0b1c4d;color:var(--text)}.question{font-size:clamp(1.3rem,3vw,2rem);line-height:1.4;min-height:76px;margin:24px 0 14px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{font:inherit;font-weight:700;color:var(--text);text-align:left;line-height:1.4;min-height:68px;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:#ffffff0b;cursor:pointer}.answer.correct{background:#2f805c55;border-color:var(--green)}.answer.wrong{background:#a33f4c55;border-color:var(--red)}.answer:disabled{cursor:default}.feedback{min-height:28px;text-align:center;font-weight:800;margin:16px 0 4px}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.result{text-align:center}.result h2{font-size:2rem}.result-card{max-width:680px;margin:18px auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.result-stats{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;color:var(--muted)}.result-stats strong{display:block;color:var(--gold);font-size:1.6rem;margin-top:5px}.hidden{display:none!important}.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}.confetti img{position:absolute;left:50%;top:48%;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 12px #64d9ffb0);animation:explode 1.45s cubic-bezier(.15,.65,.25,1) forwards}@keyframes explode{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.8) rotate(var(--r))}}@media(max-width:650px){.header{padding:11px 13px}.answers{grid-template-columns:1fr}.stats{flex-wrap:wrap}.screen{padding:20px 16px}.question{min-height:0}.answer{min-height:60px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand"><img src="./logo.svg" alt="KALECAD"><div>KALECAD<span class="sub">CAD BİLGİ YARIŞMASI</span></div></div><button id="soundToggle" class="btn" type="button" aria-pressed="true">🔊 Ses açık</button></header>
<section id="home" class="screen active"><div class="hero"><img src="./logo.svg" alt="KaleCAD logo"><h1>CAD bilgini test et!</h1><p>AutoCAD ve SketchUp sorularıyla her tur yeni bir meydan okuma.</p></div><div class="row" aria-label="Kategori seçimi"><button class="chip selected" data-cat="all">Hepsi</button><button class="chip" data-cat="AutoCAD">AutoCAD</button><button class="chip" data-cat="SketchUp">SketchUp</button></div><div class="row" aria-label="Zorluk seçimi"><button class="chip selected" data-diff="all">Tüm seviyeler</button><button class="chip" data-diff="easy">Kolay</button><button class="chip" data-diff="medium">Orta</button><button class="chip" data-diff="hard">Zor</button></div><div class="row" aria-label="Süre seçimi"><button class="chip" data-time="10">10 sn</button><button class="chip selected" data-time="15">15 sn</button><button class="chip" data-time="20">20 sn</button></div><p id="poolNote" class="summary"></p><div class="actions"><button id="start" class="primary">Oyuna başla</button></div></section>
<section id="quiz" class="screen"><div class="stats"><span id="qCount">Soru 1 / 10</span><span id="score">Puan: 0</span><span class="timer">⏱ <span class="timer-ring" id="timerRing"><span id="timerValue">15</span></span></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><p class="summary" id="autoNote">Cevabından sonra sıradaki soru otomatik açılır.</p></section>
<section id="result" class="screen"><div class="result result-card"><h2>🏁 Tur tamamlandı!</h2><p id="resultText" class="summary"></p><div class="result-stats"><span>Bu tur<strong id="roundScore">0</strong></span><span>Doğru<strong id="correctCount">0</strong></span><span>Rekor<strong id="bestScore">0</strong></span></div><div class="actions"><button id="replay" class="primary">Yeni tur</button><button id="homeBtn" class="btn">Ana menü</button></div></div></section>
</main><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
// 20 temel kavram x 10 farklı soru kalıbı = kategori başına 200 soru.
const facts={
AutoCAD:[['LINE','İki veya daha fazla nokta arasında düz çizgi çizer.'],['PLINE','Bağlı çizgi ve yay parçalarını tek bir çoklu çizgi nesnesi olarak oluşturur.'],['CIRCLE','Merkez ve yarıçap ya da çap bilgisiyle daire çizer.'],['ARC','Bir daire yayının belirlenen bölümünü oluşturur.'],['RECTANG','Dikdörtgeni tek bir kapalı çoklu çizgi olarak oluşturur.'],['POLYGON','Belirlenen kenar sayısına sahip düzgün çokgen çizer.'],['MOVE','Seçilen nesneleri bir konumdan başka bir konuma taşır.'],['COPY','Seçilen nesnelerin bir veya daha fazla kopyasını oluşturur.'],['ROTATE','Seçilen nesneleri bir taban noktası çevresinde döndürür.'],['SCALE','Seçilen nesnelerin boyutunu ölçek katsayısıyla değiştirir.'],['MIRROR','Nesnelerin belirlenen eksene göre simetrik kopyasını oluşturur.'],['OFFSET','Bir nesneye belirli mesafede paralel veya eş merkezli kopya oluşturur.'],['TRIM','Nesneleri seçilen kesme sınırlarına göre kırpar.'],['EXTEND','Nesneleri seçilen sınırlara kadar uzatır.'],['FILLET','İki nesne arasına belirlenen yarıçapta yuvarlatılmış geçiş ekler.'],['CHAMFER','İki nesnenin köşesini belirlenen mesafelerle pah kırarak birleştirir.'],['ARRAY','Nesnelerin düzenli, yinelenen kopyalarını oluşturur.'],['HATCH','Kapalı alanları tarama deseni veya dolgu ile doldurur.'],['LAYER','Çizim elemanlarını ayrı katmanlarda düzenleyip yönetir.'],['OSNAP','Nesnelerin uç, orta ve merkez gibi geometrik noktalarına hassas yakalama sağlar.']],
SketchUp:[['Push/Pull','Bir yüzeyi itip çekerek 3B hacim veya girinti oluşturur.'],['Orbit','Kamerayı modelin çevresinde döndürerek farklı açılardan görünüm sağlar.'],['Pan','Kamerayı döndürmeden görünümü yatay veya dikey kaydırır.'],['Zoom Extents','Modeldeki tüm geometriyi görünür alana sığdırır.'],['Tape Measure','Mesafeleri ölçer ve kılavuz çizgileri oluşturabilir.'],['Move','Seçilen geometriyi taşır; uygun kısayolla kopyasını da oluşturabilir.'],['Rotate','Geometriyi seçilen bir merkez ve eksen çevresinde döndürür.'],['Scale','Seçilen geometriyi ölçek tutamaçlarıyla büyütür veya küçültür.'],['Follow Me','Bir yüz profilini seçilen yol boyunca süpürerek 3B biçim oluşturur.'],['Offset','Bir yüzün kenarlarından eşit uzaklıklı iç veya dış kontur oluşturur.'],['Paint Bucket','Yüzlere renk, malzeme veya doku uygular.'],['Eraser','Kenarları siler; kenar yumuşatma görünümünü de düzenleyebilir.'],['Rectangle','Dört kenarlı dikdörtgen yüz ve kenarlar oluşturur.'],['Line','Kenar çizer; kapalı çevrim tamamlandığında yüz oluşmasını sağlar.'],['Arc','Yay tabanlı kenar geometrisi oluşturur.'],['Make Group','Geometriyi diğer model geometrisinden yalıtan bir grup oluşturur.'],['Make Component','Geometriyi yeniden kullanılabilir bileşene dönüştürür.'],['Outliner','Modeldeki grup ve bileşenlerin hiyerarşisini listeler.'],['Tags','Gruplara ve bileşenlere görünürlük yönetimi için etiket atar.'],['Scenes','Kamera görünümü ve görünürlük gibi model durumlarını kaydeder.']]
};
const templates=[n=>`${n} komutu/aracı ne işe yarar?`,n=>`${n} kullanıldığında hangi işlem yapılır?`,n=>`Hangi işlev ${n} ile gerçekleştirilir?`,n=>`${n} aracının temel amacı nedir?`,n=>`Bir çizimde/modelde ${n} ne sağlar?`,n=>`${n} seçeneği hangi sonucu oluşturur?`,n=>`${n} hangi tür düzenleme için kullanılır?`,n=>`${n} ile ilgili doğru açıklama hangisidir?`,n=>`Hangi araç/komut şu işlemi yapar: ${n}?`,n=>`${n} kullanıldığında ne elde edilir?`];
const easyNames=new Set(['LINE','CIRCLE','MOVE','COPY','Rectangle','Orbit','Pan','Select','Paint Bucket','Push/Pull']);
const mediumNames=new Set(['PLINE','OFFSET','TRIM','EXTEND','Tape Measure','Rotate','Scale','Follow Me','Make Group','Tags']);
const $=id=>document.getElementById(id);let bank=[],category='all',difficulty='all',round=[],index=0,score=0,correctCount=0,locked=false,seconds=15,chosenTime=15,timerId=null,advanceId=null,soundOn=true,audioCtx=null,usedIds=new Set();
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function buildBank(){const out=[];for(const [cat,items] of Object.entries(facts))items.forEach(([name,answer],i)=>templates.forEach((make,j)=>out.push({id:`${cat}-${i}-${j}`,category:cat,name,answer,q:make(name),difficulty:easyNames.has(name)?'easy':mediumNames.has(name)?'medium':'hard'})));return out}
function filteredPool(includeUsed=false){return bank.filter(q=>(category==='all'||q.category===category)&&(difficulty==='all'||q.difficulty===difficulty)&&(includeUsed||!usedIds.has(q.id)))}
function updatePool(){const count=filteredPool().length;$('poolNote').textContent=`${count} yeni soru mevcut • ${category==='all'?'AutoCAD ve SketchUp':category} • ${difficulty==='all'?'tüm zorluklar':difficulty}`}
function setSelection(selector,attr,value){document.querySelectorAll(selector).forEach(b=>b.classList.toggle('selected',b.getAttribute(attr)===String(value)))}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;setSelection('[data-cat]','data-cat',category);updatePool()});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;setSelection('[data-diff]','data-diff',difficulty);updatePool()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{chosenTime=Number(b.dataset.time);setSelection('[data-time]','data-time',chosenTime)});
function playTone(freq,duration,wave='sine'){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=wave;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.13,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.03)}catch(_){}}
function playCorrect(){playTone(660,.17,'triangle');setTimeout(()=>playTone(880,.2,'triangle'),90)}function playWrong(){playTone(220,.28,'sawtooth')}
function burstLogo(){const layer=$('confetti');layer.replaceChildren();for(let i=0;i<24;i++){const img=document.createElement('img');img.src='./logo.svg';img.alt='';const angle=(Math.PI*2*i)/24+(Math.random()-.5)*.24;const distance=120+Math.random()*240;img.style.setProperty('--x',`${Math.cos(angle)*distance}px`);img.style.setProperty('--y',`${Math.sin(angle)*distance}px`);img.style.setProperty('--r',`${Math.random()*720-360}deg`);img.style.animationDelay=`${Math.random()*.09}s`;layer.appendChild(img)}setTimeout(()=>layer.replaceChildren(),1900)}
function startRound(){clearInterval(timerId);clearTimeout(advanceId);let pool=filteredPool();if(pool.length<10){usedIds.clear();pool=filteredPool()}round=shuffle(pool).slice(0,10);round.forEach(q=>usedIds.add(q.id));index=0;score=0;correctCount=0;showScreen('quiz');renderQuestion()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function updateTimer(){const n=Math.max(0,seconds);$('timerValue').textContent=n;$('timerRing').style.background=`conic-gradient(var(--cyan) ${(n/chosenTime)*100}%,#ffffff18 0)`}
function getOptions(item){const wrong=shuffle([...new Set(bank.filter(q=>q.category===item.category&&q.answer!==item.answer).map(q=>q.answer))]).slice(0,3);return shuffle([item.answer,...wrong])}
function renderQuestion(){clearInterval(timerId);clearTimeout(advanceId);locked=false;seconds=chosenTime;const item=round[index];if(!item)return finishRound();$('qCount').textContent=`Soru ${index+1} / ${round.length}`;$('score').textContent=`Puan: ${score}`;$('question').textContent=item.q;$('feedback').textContent='';$('feedback').className='feedback';const wrap=$('answers');wrap.replaceChildren();getOptions(item).forEach(text=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=text;b.addEventListener('click',()=>answer(b,text===item.answer,false));wrap.appendChild(b)});updateTimer();timerId=setInterval(()=>{if(locked)return;seconds=Math.max(0,seconds-1);updateTimer();if(seconds===0){clearInterval(timerId);answer(null,false,true)}},1000)}
function answer(button,isCorrect,timedOut){if(locked)return;locked=true;clearInterval(timerId);const item=round[index];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===item.answer)b.classList.add('correct')});if(isCorrect){correctCount++;score+=10+seconds;$('feedback').textContent=`Doğru! +${10+seconds} puan`;$('feedback').classList.add('good');burstLogo();playCorrect()}else{if(button)button.classList.add('wrong');$('feedback').textContent=timedOut?`Süre doldu! Doğru cevap: ${item.answer}`:`Yanlış. Doğru cevap: ${item.answer}`;$('feedback').classList.add('bad');playWrong()}$('score').textContent=`Puan: ${score}`;advanceId=setTimeout(()=>{index++;if(index<round.length)renderQuestion();else finishRound()},isCorrect?1500:1900)}
function finishRound(){clearInterval(timerId);clearTimeout(advanceId);const key='kalecad_best_score';let best=0;try{best=Number(localStorage.getItem(key)||0)}catch(_){}if(score>best){best=score;try{localStorage.setItem(key,String(best))}catch(_){}}$('roundScore').textContent=score;$('correctCount').textContent=`${correctCount}/${round.length}`;$('bestScore').textContent=best;$('resultText').textContent=`${correctCount} doğru, ${round.length-correctCount} yanlış. ${correctCount>=8?'Harika! CAD bilgin çok iyi.':correctCount>=5?'Güzel gidiyorsun; yeni turda devam et!':'Yeni turda tekrar dene ve rekorunu geliştir!'}`;showScreen('result')}
$('start').onclick=()=>{usedIds.clear();startRound()};$('replay').onclick=startRound;$('homeBtn').onclick=()=>showScreen('home');$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 Ses açık':'🔇 Ses kapalı';$('soundToggle').setAttribute('aria-pressed',String(soundOn));if(soundOn)playTone(660,.12)};
bank=buildBank();updatePool();
</script>
</body>
</html>
