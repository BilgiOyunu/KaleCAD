<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07163c">
  <meta name="description" content="KALECAD — CAD bilgi yarışması">
  <title>KALECAD | CAD Bilgi Yarışması</title>
</head>
<body>
  <script>
    (async function () {
      try {
        const response = await fetch('https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/b08c22967c5b11f1f42aaca3b696873ef831d304/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Oyun dosyası yüklenemedi (' + response.status + ').');
        const gameHtml = await response.text();
        const campusScript = '<script src="https://raw.githubusercontent.com/BilgiOyunu/KaleCAD/kampus-secimi/campus-selection.js"><\\/script>';
        document.open();
        document.write(gameHtml.replace(/<\\/body>/i, campusScript + '</body>'));
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font-family:sans-serif;padding:2rem;text-align:center"><h1>KALECAD yüklenemedi</h1><p>' + error.message + '</p></main>';
      }
    })();
  </script>
</body>
</html>
