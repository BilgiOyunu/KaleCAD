<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kale Okulları</title>
  <desc id="desc">Lacivert zemin üzerinde kale ve beyaz KALE OKULLARI yazısı</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142d75"/><stop offset=".55" stop-color="#07163c"/><stop offset="1" stop-color="#040b20"/></linearGradient>
    <radialGradient id="scanGlow"><stop stop-color="#64d9ff" stop-opacity=".32"/><stop offset="1" stop-color="#64d9ff" stop-opacity="0"/></radialGradient>
    <style>
      .cad-ring{transform-origin:512px 512px;animation:cadRotate 8s linear infinite}
      .cad-scan{transform-origin:512px 512px;animation:cadSweep 3.2s ease-in-out infinite alternate}
      .cad-pulse{animation:cadPulse 2.4s ease-in-out infinite}
      @keyframes cadRotate{to{transform:rotate(360deg)}}
      @keyframes cadSweep{from{transform:rotate(-25deg);opacity:.2}to{transform:rotate(25deg);opacity:.8}}
      @keyframes cadPulse{0%,100%{opacity:.42}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.cad-ring,.cad-scan,.cad-pulse{animation:none}}
    </style>
  </defs>
  <rect width="1024" height="1024" rx="80" fill="url(#navy)"/>
  <g fill="none" stroke="#64d9ff" stroke-opacity=".42">
    <circle class="cad-ring" cx="512" cy="512" r="438" stroke-width="2" stroke-dasharray="3 18"/>
    <circle class="cad-pulse" cx="512" cy="512" r="404" stroke-width="1.5" stroke-dasharray="42 14 4 14"/>
    <path d="M512 46v42M512 936v42M46 512h42M936 512h42" stroke-width="3"/>
    <path class="cad-scan" d="M512 512V95" stroke-width="2"/>
  </g>
  <circle cx="512" cy="512" r="270" fill="url(#scanGlow)" class="cad-pulse"/>
  <path d="M250 290 225 190h105v72h65v-72h105v72h65v-72h105v72h65v-72h105l-25 100-50 260H300l-50-260Z" fill="#7c89ac" opacity=".8"/>
  <path d="M145 580h734v32H145z" fill="#7c89ac" opacity=".72"/>
  <text x="512" y="565" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="226" letter-spacing="-12">KALE</text>
  <text x="512" y="690" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="105" letter-spacing="-5">OKULLARI</text>
</svg>
